<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ENG-TEAM 协作规程 · 知识图谱</title>
<meta name="description" content="ENG-TEAM（多模型协作规程）的可视化讲解网页：单文件、离线可用。规则以同目录的 ENG-TEAM.md 为准。">
<!-- ENG-TEAM.html：ENG-TEAM.md 的可视化讲解网页（单文件、按页跳转、离线可用）。所有规则以 ENG-TEAM.md 原文为准。 -->
<style>
:root{
  --bg:#F6F7F9; --paper:#FFFFFF; --ink:#1D2330; --ink2:#485164; --ink3:#767F92; --line:#E3E6EC; --line2:#CDD2DC;
  --pri:#3A47A6; --pri-d:#2D3889; --pri-l:#ECEEF9; --pri-ll:#F5F6FC;
  --opus:#C2571A; --opus-l:#FCEFE6; --sonnet:#9C2F7A; --sonnet-l:#F8EAF3;
  --astra:#13786C; --astra-l:#E4F3F0; --sol:#0B78A8; --sol-l:#E3F1F8;
  --author:#4B5563; --author-l:#EEF0F3;
  --ok:#2E7D32; --ok-l:#EAF4EA; --bad:#C62828; --bad-l:#FBEBEB;
  --use:#8A6100; --use-l:#FBF3DE;
  --hl:#FFEC99;
  --r:10px;
  --sh:0 1px 2px rgba(22,32,64,.05),0 6px 18px rgba(22,32,64,.05);
  --font:-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC","Noto Sans CJK SC",sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.78 var(--font);overflow-x:hidden}
a{color:var(--pri);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px;border-radius:4px}
svg{display:block}
.ico{width:18px;height:18px;flex:none}

/* ---------- 氛围层 ---------- */
#atmo{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#atmo svg{position:absolute}
#atmo .a1{right:-40px;top:40px;width:460px;height:340px}
#atmo .a2{right:-30px;bottom:-30px;transform:scaleX(-1);width:420px;height:300px}
body.no-atmo #atmo{display:none}
@media (min-width:1360px){body.has-toc #atmo .a1{display:none}}

/* ---------- 顶栏 ---------- */
#top{position:fixed;top:0;left:0;right:0;height:56px;z-index:40;display:flex;align-items:center;gap:10px;padding:0 14px;background:#fff;border-bottom:1px solid var(--line)}
#brand{display:flex;align-items:center;gap:9px;color:var(--ink);font-weight:650;white-space:nowrap;font-size:15px}
#brand:hover{text-decoration:none}
#brand .ico{width:26px;height:26px;color:var(--pri)}
#brand small{font-weight:400;color:var(--ink3);font-size:12.5px}
#search-wrap{flex:1;display:flex;justify-content:center;min-width:0}
#search{position:relative;width:100%;max-width:520px}
#q{width:100%;height:36px;border:1px solid var(--line2);border-radius:18px;padding:0 14px 0 36px;background:#fff;font:inherit;font-size:14px;color:var(--ink)}
#q::placeholder{color:var(--ink3)}
#q:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-l)}
#search .sicon{position:absolute;left:12px;top:9px;width:18px;height:18px;color:var(--ink3);pointer-events:none}
#sres{position:absolute;top:42px;left:0;right:0;max-height:min(72vh,560px);overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 36px rgba(22,32,64,.16);padding:6px;z-index:50}
#sres .grp{font-size:12px;color:var(--ink3);padding:8px 10px 4px;letter-spacing:.02em}
#sres .it{display:flex;gap:8px;align-items:flex-start;padding:7px 10px;border-radius:8px;color:var(--ink);cursor:pointer;line-height:1.5}
#sres .it:hover,#sres .it.on{background:var(--pri-l);text-decoration:none}
#sres .it .tt{font-weight:600;font-size:14px}
#sres .it .sub{font-size:12.5px;color:var(--ink2);display:block;margin-top:1px}
#sres .it .num{flex:none;min-width:22px;height:22px;border-radius:6px;background:var(--pri-ll);border:1px solid var(--line);font-size:12px;display:grid;place-items:center;color:var(--pri)}
#sres mark{background:var(--hl);color:inherit;border-radius:2px;padding:0 1px}
#sres .empty{padding:14px;color:var(--ink3);font-size:13.5px}
#sres .hint{padding:6px 10px 4px;font-size:12px;color:var(--ink3);border-top:1px solid var(--line);margin-top:4px}
#actions{display:flex;gap:6px;align-items:center}
.tb{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--ink2);font-size:13.5px;white-space:nowrap}
.tb:hover{border-color:var(--line2);color:var(--ink);text-decoration:none}
.tb.on{background:var(--pri);border-color:var(--pri);color:#fff}
.tb b{font-weight:600;color:var(--pri);font-size:12.5px}
.tb.on b{color:#fff}
.ib{display:none;width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:#fff;align-items:center;justify-content:center;color:var(--ink2);flex:none}
.ib:hover{color:var(--ink);border-color:var(--line2)}

/* ---------- 侧栏 ---------- */
#side{position:fixed;top:56px;bottom:0;left:0;width:272px;z-index:20;overflow-y:auto;background:rgba(255,255,255,.86);border-right:1px solid var(--line);padding:14px 10px 30px}
#side .home{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--ink);font-weight:600;font-size:14px}
#side .home.on{background:var(--pri-l);color:var(--pri)}
#side .layer{margin-top:14px}
#side .lh{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink3);padding:4px 10px;letter-spacing:.03em}
#side .lh .ico{width:16px;height:16px;color:var(--pri)}
#side a.nd{display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:8px;color:var(--ink2);font-size:14px;line-height:1.45}
#side a.nd:hover{background:var(--pri-ll);text-decoration:none;color:var(--ink)}
#side a.nd.on{background:var(--pri-l);color:var(--pri);font-weight:600}
#side .no{flex:none;width:22px;height:22px;border-radius:6px;border:1px solid var(--line2);font-size:11.5px;display:grid;place-items:center;color:var(--ink3);background:#fff}
#side a.nd.on .no{border-color:var(--pri);color:var(--pri)}
#side .done .no{background:var(--pri);border-color:var(--pri);color:#fff}
#side .ck{margin-left:auto;width:15px;height:15px;color:var(--pri);visibility:hidden}
#side .done .ck{visibility:visible}
#side .refl{margin-top:16px;border-top:1px solid var(--line);padding-top:10px}
#scrim{display:none}

/* ---------- 主体 ---------- */
#view{position:relative;z-index:1;margin-left:272px;padding:76px 28px 60px;min-height:100vh}
.page,.homepage,.refpage{max-width:800px;margin:0 auto}
.homepage{max-width:1180px}
.refpage{max-width:980px}
#toc{position:fixed;top:76px;right:18px;width:196px;z-index:15;display:none;font-size:13px;max-height:calc(100vh - 96px);overflow:auto}
#toc .th{font-size:12px;color:var(--ink3);margin-bottom:6px;padding-left:10px;letter-spacing:.03em}
#toc a{display:block;padding:4px 10px;border-left:2px solid var(--line);color:var(--ink2);line-height:1.45}
#toc a:hover{color:var(--ink);text-decoration:none;border-left-color:var(--line2)}
#toc a.on{border-left-color:var(--pri);color:var(--pri);font-weight:600}
@media (min-width:1360px){ body.has-toc #toc{display:block} body.has-toc #view{padding-right:236px} }

/* ---------- 页头 ---------- */
.ph{background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);padding:22px 24px 18px;margin-bottom:22px;position:relative;overflow:hidden}
.ph::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--pri),#7C86CF 60%,transparent)}
.ph .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12.5px;color:var(--ink3)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px 2px 7px;border-radius:20px;border:1px solid var(--line);background:var(--pri-ll);color:var(--pri);font-size:12.5px;line-height:1.7}
.chip .ico{width:15px;height:15px}
.ph h1{font-size:27px;line-height:1.35;margin:10px 0 6px;letter-spacing:.01em}
.ph h1 .n{color:var(--pri);font-weight:600;margin-right:10px}
.ph .brief{color:var(--ink2);margin:0 0 12px}
.ph .comp{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--ink3);margin-bottom:14px}
.nb{display:grid;grid-template-columns:1fr auto 1.1fr auto 1fr;gap:10px;align-items:center;border-top:1px dashed var(--line2);padding-top:14px}
.nb .col{display:flex;flex-direction:column;gap:6px;min-width:0}
.nb .cap{font-size:11.5px;color:var(--ink3);letter-spacing:.03em}
.nb .none{font-size:12.5px;color:var(--ink3);border:1px dashed var(--line2);border-radius:8px;padding:6px 9px;background:#fff}
.nb a.nn{display:flex;gap:7px;align-items:center;padding:5px 9px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:13px;line-height:1.4}
.nb a.nn:hover{border-color:var(--pri);text-decoration:none}
.nb a.nn .no,.nb .me .no{flex:none;width:20px;height:20px;border-radius:5px;background:var(--pri-ll);border:1px solid var(--line2);font-size:11px;display:grid;place-items:center;color:var(--pri)}
.nb .me{display:flex;gap:8px;align-items:center;padding:9px 11px;border-radius:10px;border:2px solid var(--pri);background:var(--pri-l);font-weight:600;font-size:14px;line-height:1.4}
.nb .arr{color:var(--ink3);width:22px;height:22px}
@media (max-width:720px){ .nb{grid-template-columns:1fr} .nb .arr{transform:rotate(90deg);margin:0 auto} }

/* ---------- 正文 ---------- */
.body>p.lead{font-size:16.5px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--pri);border-radius:10px;padding:14px 18px;margin:0 0 26px}
.body section{margin:0 0 34px;scroll-margin-top:72px}
.body h2{font-size:20.5px;line-height:1.45;margin:0 0 12px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.body h2 .h{letter-spacing:.01em}
.body h3{font-size:16.5px;margin:20px 0 8px}
.body p{margin:0 0 12px}
.body ul,.body ol{margin:0 0 12px;padding-left:1.4em}
.body li{margin:3px 0}
.body li>ul{margin:3px 0 4px}
mark.hl{background:linear-gradient(transparent 52%,var(--hl) 52%);color:inherit;padding:0 1px}
.body table,.box table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.6;margin:6px 0 14px;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.body th,.body td,.box th,.box td{text-align:left;vertical-align:top;padding:8px 11px;border-bottom:1px solid var(--line)}
.body th,.box th{background:var(--pri-ll);font-weight:600;color:var(--ink2);font-size:13px}
.body tr:last-child td,.box tr:last-child td{border-bottom:none}
.tw{overflow-x:auto;margin:6px 0 14px;border-radius:10px}
.tw table{margin:0}
blockquote.rule{margin:10px 0 16px;padding:12px 16px 10px;background:#fff;border:1px solid var(--line);border-radius:10px;position:relative}
blockquote.rule .rh{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink3);margin-bottom:4px;letter-spacing:.03em}
blockquote.rule .rh .ico{width:14px;height:14px;color:var(--pri)}
blockquote.rule p,blockquote.rule ul,blockquote.rule ol{font-size:14.5px;margin-bottom:6px}
.file{display:inline-flex;align-items:center;gap:3px;padding:0 6px 0 4px;margin:0 1px;border-radius:5px;background:var(--pri-ll);border:1px solid var(--line);font-size:.9em;line-height:1.55;white-space:nowrap;color:var(--ink)}
.file .ico{width:13px;height:13px;color:var(--ink3)}
.who{display:inline-flex;align-items:center;gap:5px;padding:0 7px 0 6px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:.92em;line-height:1.6;white-space:nowrap}
.who i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--author));flex:none}
.who i.sq{border-radius:2px;transform:rotate(45deg)}
.note{font-size:13.5px;color:var(--ink2);background:var(--pri-ll);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:8px 0 14px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:8px 0 14px}
.cards.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:640px){.cards.c2{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.65}
.card h4{margin:0 0 6px;font-size:14.5px;display:flex;align-items:center;gap:7px}
.card h4 i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.card .k{font-size:12px;color:var(--ink3);display:block;margin-top:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 0 14px}
@media (max-width:640px){.two{grid-template-columns:1fr}}
.pos{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px 20px 6px}
.sum{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px 20px 6px}
.sum h2,.pos h2{font-size:18px}
table.gl td:first-child{white-space:nowrap;font-weight:600}
table.gl td:nth-child(2){color:var(--ink2);white-space:nowrap}
@media (max-width:640px){table.gl td:nth-child(2){white-space:normal}}
.pl{border-bottom:1px solid rgba(58,71,166,.35)}
.pl:hover{text-decoration:none;border-bottom-color:var(--pri)}

/* 层次标签 */
.lv{display:inline-flex;align-items:center;gap:5px;padding:1px 9px 1px 6px;border-radius:6px;font-size:12px;font-weight:500;line-height:1.7;color:var(--ink2);background:#fff;border:1px solid var(--line2);cursor:help;white-space:nowrap;vertical-align:middle}
.lv .ico{width:12px;height:12px;color:var(--ink2)}
.lv-core{border-width:1.5px;border-color:#9AA2B3}
.lv-adv{border-style:double;border-width:3px;padding:0 8px 0 5px}
.lv-cross{border-style:dashed}
.lv-proj{border-color:var(--pri);color:var(--pri)}
.lv-proj .ico{color:var(--pri)}

/* 速查链接 */
button.qlink{all:unset;cursor:pointer;border-bottom:1.5px dotted var(--pri);color:inherit}
button.qlink:hover,button.qlink:focus-visible{background:var(--pri-ll);border-bottom-style:solid}
button.qbadge{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:3px;font-size:11.5px;color:var(--pri);border:1px solid var(--line2);border-radius:5px;padding:0 5px;margin-left:4px;background:#fff;line-height:1.6}
.qt{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;line-height:1.6;padding:0 7px 0 5px;border-radius:5px;border:1px solid var(--line2);color:var(--ink2);background:#fff;white-space:nowrap}
.qt .ico{width:12px;height:12px}
.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--pri);background:var(--pri-l)}100%{box-shadow:0 0 0 3px transparent}}
.hlbox{position:absolute;z-index:5;pointer-events:none;background:rgba(255,226,102,.55);border-radius:3px;animation:hlfade 2.2s ease-out forwards}
@keyframes hlfade{0%,55%{opacity:1}100%{opacity:0}}

/* 页脚 */
.pf{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.pf a{display:block;padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
.pf a:hover{border-color:var(--pri);text-decoration:none}
.pf a small{display:block;color:var(--ink3);font-size:12px}
.pf .nx{text-align:right}
.pf .blank{visibility:hidden}
.understood{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:26px;padding:14px 18px;border:1px solid var(--line);border-radius:12px;background:#fff}
.understood p{margin:0;font-size:14px;color:var(--ink2)}
.btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--line2);background:#fff;color:var(--ink);font-size:14px}
.btn:hover{border-color:var(--pri);color:var(--pri)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:var(--pri-d);color:#fff}
.btn .ico{width:16px;height:16px}

/* ---------- 图（教学图） ---------- */
figure.fig{margin:14px 0 18px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);padding:16px 18px 12px;min-height:120px}
.fig .fh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:2px}
.fig .fh h3{margin:0;font-size:16px}
.fig .fh .tag{font-size:11.5px;color:var(--ink3);border:1px solid var(--line);border-radius:5px;padding:0 6px}
.fig .goal{font-size:13.5px;color:var(--ink2);margin:4px 0 12px;padding:7px 11px;background:var(--pri-ll);border-radius:8px;border:1px solid var(--line)}
.fig .goal b{color:var(--pri);font-weight:600;margin-right:4px}
.fig figcaption{font-size:12.5px;color:var(--ink3);line-height:1.65;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line2)}
.fig figcaption b{color:var(--ink2);font-weight:600}
.ctrls{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:10px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden;background:#fff;flex-wrap:wrap}
.seg button{border:none;background:none;padding:5px 11px;font-size:13px;color:var(--ink2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--pri);color:#fff}
.seg button:hover:not(.on){background:var(--pri-ll)}
.stp{display:inline-flex;gap:4px;align-items:center}
.stp button{width:32px;height:30px;border-radius:8px;border:1px solid var(--line2);background:#fff;display:grid;place-items:center;color:var(--ink2);padding:0}
.stp button:hover:not(:disabled){border-color:var(--pri);color:var(--pri)}
.stp button:disabled{opacity:.4;cursor:default}
.stp button .ico{width:16px;height:16px}
.stp .cnt{font-size:12.5px;color:var(--ink3);margin-left:6px;min-width:64px}
.rng{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2)}
.rng input{width:150px;accent-color:var(--pri)}
.rng output{min-width:48px;font-weight:600;color:var(--ink)}
.pre{display:inline-flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--ink3)}
.pre button{border:1px solid var(--line2);background:#fff;border-radius:7px;padding:2px 9px;font-size:12.5px;color:var(--ink2)}
.pre button:hover{border-color:var(--pri);color:var(--pri)}
.pre button.on{border-color:var(--pri);background:var(--pri-l);color:var(--pri)}
.stage{position:relative;background:linear-gradient(var(--pri-ll),#fff 40%);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stage.plain{background:#fff}
.stage svg{width:100%;height:auto}
.scrollx{overflow-x:auto}
.scrollx>svg{min-width:640px}
.explain{margin-top:10px;font-size:14px;line-height:1.7;background:#FBFBFD;border:1px solid var(--line);border-left:3px solid var(--pri);border-radius:8px;padding:9px 13px;min-height:52px}
.explain b{color:var(--ink)}
.explain .st{display:inline-flex;align-items:center;gap:4px;font-weight:600}
.okc{color:var(--ok)} .badc{color:var(--bad)}
.panel{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:10px}
.panel .pv{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:#fff;font-size:13px;line-height:1.5}
.panel .pv span{display:block;font-size:11.5px;color:var(--ink3)}
.panel .pv b{font-weight:600}
.pv.chg{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri-l)}
.quiz{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 10px;font-size:13.5px}
.quiz .qq{width:100%;color:var(--ink2)}
.quiz button{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:4px 11px;font-size:13px}
.quiz button:hover:not(:disabled){border-color:var(--pri);color:var(--pri)}
.quiz button.right{border-color:var(--ok);background:var(--ok-l);color:var(--ok)}
.quiz button.wrong{border-color:var(--bad);background:var(--bad-l);color:var(--bad)}
.quiz button:disabled{cursor:default}
.list{display:flex;flex-direction:column;gap:6px}
.pick{display:flex;align-items:center;gap:8px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 10px;font-size:13.5px;line-height:1.5;color:var(--ink)}
.pick:hover{border-color:var(--line2);background:var(--pri-ll)}
.pick.on{border-color:var(--pri);background:var(--pri-l);box-shadow:inset 3px 0 0 var(--pri)}
.pick .ico{width:15px;height:15px;color:var(--ink3)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;border:1.5px solid var(--c);background:var(--cl,#fff);display:inline-block}
.svgt{font-family:var(--font)}
.fade-t{transition:opacity .25s,transform .35s}
.mv{transition:transform .45s cubic-bezier(.3,.7,.3,1),opacity .3s}
@media (prefers-reduced-motion:reduce){ .mv,.fade-t{transition:none!important} .flash,.hlbox{animation-duration:.01s} }

/* ---------- 首页 ---------- */
.hero{background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);padding:28px 30px 22px;margin-bottom:20px;position:relative;overflow:hidden}
.hero h1{font-size:30px;margin:0 0 6px;line-height:1.3}
.hero h1 small{display:block;font-size:14px;color:var(--ink3);font-weight:500;margin-top:4px}
.hero p{max-width:740px;color:var(--ink2);margin:8px 0}
.hero .deco{position:absolute;right:14px;top:10px;width:260px;height:130px;opacity:.9;pointer-events:none}
@media (max-width:860px){.hero .deco{display:none}}
.box{background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);padding:18px 20px;margin-bottom:20px}
.box>h2{font-size:19px;margin:0 0 6px;display:flex;align-items:center;gap:8px}
.box>h2 .ico{color:var(--pri);width:20px;height:20px}
.box>p.d{color:var(--ink2);margin:0 0 12px;font-size:14px}
.gtool{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:10px;font-size:13px;color:var(--ink2)}
.toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.toggle input{position:absolute;opacity:0;width:1px;height:1px}
.toggle .sw{width:34px;height:20px;border-radius:10px;background:var(--line2);position:relative;transition:background .2s}
.toggle .sw::after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .2s}
.toggle input:checked+.sw{background:var(--pri)}
.toggle input:checked+.sw::after{transform:translateX(14px)}
.toggle input:focus-visible+.sw{outline:2px solid var(--pri);outline-offset:2px}
.fchips{display:inline-flex;gap:5px;flex-wrap:wrap;align-items:center}
.fchips .lv{cursor:pointer}
.fchips .lv.on{background:var(--pri-l)}
.fchips .lv.off{opacity:.45}
.gwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
.gwrap svg{min-width:900px;width:100%;height:auto}
.gn{cursor:pointer}
.gn rect.bx{fill:#fff;stroke:var(--line2);stroke-width:1.2;transition:fill .2s,stroke .2s,opacity .2s}
.gn text{font-size:13.5px;fill:var(--ink);pointer-events:none}
.gn .nbg{fill:var(--pri-ll);stroke:var(--line2)}
.gn .nt{font-size:12px;fill:var(--pri);font-weight:600}
.gn .dk{fill:var(--pri)}
.gn.done .nbg{fill:var(--pri);stroke:var(--pri)} .gn.done .nt{fill:#fff}
.gn:hover rect.bx,.gn:focus rect.bx{stroke:var(--pri)}
.ge{fill:none;stroke:#B8BECA;stroke-width:1.3;opacity:.55;transition:opacity .2s,stroke .2s}
.gsvg.focus .gn{opacity:.28}
.gsvg.focus .ge{opacity:.12}
.gsvg.focus .gn.me{opacity:1}
.gsvg.focus .gn.me rect.bx{stroke:var(--ink);stroke-width:2.2}
.gsvg.focus .gn.pre{opacity:1}
.gsvg.focus .gn.pre rect.bx{stroke:var(--pri);stroke-width:2;fill:var(--pri-ll)}
.gsvg.focus .gn.use{opacity:1}
.gsvg.focus .gn.use rect.bx{stroke:var(--use);stroke-width:2;stroke-dasharray:5 3;fill:var(--use-l)}
.gsvg.focus .ge.pre{opacity:1;stroke:var(--pri);stroke-width:1.8}
.gsvg.focus .ge.use{opacity:1;stroke:var(--use);stroke-width:1.8;stroke-dasharray:5 3}
.gsvg.filt .gn.fo{opacity:.25}
.gsvg.filt .gn.fi rect.bx{stroke:var(--ink);stroke-width:2}
.gsvg.exp .gn{opacity:.22} .gsvg.exp .ge{opacity:.1}
.gsvg.exp .gn.e0{opacity:1} .gsvg.exp .gn.e0 rect.bx{stroke:var(--ink);stroke-width:2.2}
.gsvg.exp .gn.e1{opacity:1} .gsvg.exp .gn.e1 rect.bx{stroke:var(--pri);stroke-width:2;fill:var(--pri-l)}
.gsvg.exp .gn.e2{opacity:.85} .gsvg.exp .gn.e2 rect.bx{stroke:var(--pri)}
.gsvg.exp .ge.e{opacity:1;stroke:var(--pri);stroke-width:1.8}
.gord{fill:var(--pri);} .gordt{fill:#fff;font-size:11px;font-weight:700}
.gband{fill:#F8F9FC;stroke:#EBEDF2}
.gbl{font-size:12px;fill:var(--ink3);letter-spacing:.06em}
.path-list{margin-top:10px;font-size:13.5px;color:var(--ink2);min-height:26px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.path-list a{display:inline-flex;align-items:center;gap:5px;padding:1px 8px 1px 4px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);font-size:13px}
.path-list a b{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:4px;background:var(--pri);color:#fff;font-size:11px}
.layers{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.layers .ly{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;font-size:13.5px;line-height:1.6}
.layers .ly h4{margin:0 0 4px;display:flex;align-items:center;gap:7px;font-size:14.5px}
.layers .ly h4 .ico{color:var(--pri)}
.kn td:first-child{font-weight:700;color:var(--pri);white-space:nowrap}

/* ---------- 速查页 ---------- */
.rtool{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin:10px 0 16px}
.rtool input{height:34px;border:1px solid var(--line2);border-radius:9px;padding:0 11px;font:inherit;font-size:13.5px;min-width:200px}
.rtool input:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-l)}
.tfil{display:flex;flex-wrap:wrap;gap:6px}
.tfil button{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line2);background:#fff;border-radius:7px;padding:3px 9px 3px 7px;font-size:12.5px;color:var(--ink2)}
.tfil button .ico{width:13px;height:13px}
.tfil button.on{border-color:var(--pri);background:var(--pri-l);color:var(--pri)}
.tfil button small{color:var(--ink3)}
.rlay{display:grid;grid-template-columns:200px 1fr;gap:18px}
@media (max-width:820px){.rlay{grid-template-columns:1fr}.ridx{display:none}}
.ridx{position:sticky;top:72px;align-self:start;font-size:13px;max-height:calc(100vh - 90px);overflow:auto}
.ridx a{display:block;padding:3px 8px;color:var(--ink2);border-radius:6px;line-height:1.45}
.ridx a:hover{background:var(--pri-ll);text-decoration:none}
.ridx .il{font-size:11.5px;color:var(--ink3);margin:10px 0 2px 8px}
.rgrp{margin-bottom:18px}
.rgrp>h3{font-size:15px;margin:0 0 8px;display:flex;align-items:center;gap:8px;color:var(--ink2)}
.rgrp>h3 .ico{color:var(--pri)}
details.rpg{border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:8px}
details.rpg>summary{cursor:pointer;padding:8px 12px;font-weight:600;font-size:14px;display:flex;gap:8px;align-items:center;list-style:none}
details.rpg>summary::-webkit-details-marker{display:none}
details.rpg>summary::before{content:"";width:7px;height:7px;border-right:1.6px solid var(--ink3);border-bottom:1.6px solid var(--ink3);transform:rotate(-45deg);transition:transform .15s;margin-right:2px}
details.rpg[open]>summary::before{transform:rotate(45deg)}
details.rpg>summary small{font-weight:400;color:var(--ink3);margin-left:auto;font-size:12px}
.ents{padding:0 10px 8px}
.ent{border-top:1px solid var(--line);padding:9px 4px 8px;font-size:14px;line-height:1.65;scroll-margin-top:80px}
.ent:first-child{border-top:none}
.ent .eh{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:2px}
.ent .eh b{font-size:14.5px}
.ent .src{font-size:12.5px;color:var(--ink3);margin-top:3px}
.ent.flash{border-radius:8px}
.letters{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px;position:sticky;top:60px;background:var(--bg);padding:6px 0;z-index:3}
.letters a{display:grid;place-items:center;width:28px;height:28px;border:1px solid var(--line2);border-radius:7px;background:#fff;font-size:13px;font-weight:600;color:var(--pri)}
.letters a:hover{background:var(--pri-l);text-decoration:none}
.letters span{display:grid;place-items:center;width:28px;height:28px;font-size:13px;color:#C3C8D2}
.lgrp>h3{font-size:18px;color:var(--pri);margin:6px 0 6px;scroll-margin-top:110px}
.lgrp{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 12px;margin-bottom:10px}

/* ---------- 说明卡片与弹出卡 ---------- */
#tip{position:fixed;z-index:80;max-width:300px;background:#fff;border:1px solid var(--line2);border-radius:10px;box-shadow:0 10px 28px rgba(22,32,64,.16);padding:9px 12px;font-size:13px;line-height:1.6;color:var(--ink2);pointer-events:none}
#tip b{display:block;color:var(--ink);font-size:13.5px;margin-bottom:2px}
#pop{position:fixed;z-index:85;width:min(340px,calc(100vw - 24px));background:#fff;border:1px solid var(--line2);border-radius:12px;box-shadow:0 14px 36px rgba(22,32,64,.18);padding:12px 14px;font-size:13.5px;line-height:1.65}
#pop .eh{display:flex;gap:8px;align-items:center;margin-bottom:4px}
#pop .eh b{font-size:14.5px}
#pop .ft{margin-top:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
#pop .x{border:none;background:none;color:var(--ink3);font-size:12.5px;padding:2px 4px}
#pgpop{position:fixed;z-index:85;top:60px;right:12px;width:300px;max-height:calc(100vh - 80px);overflow:auto;background:#fff;border:1px solid var(--line2);border-radius:12px;box-shadow:0 14px 36px rgba(22,32,64,.18);padding:12px 14px;font-size:13.5px}
#pgpop h4{margin:0 0 4px;font-size:14.5px}
#pgpop .bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:6px 0 10px}
#pgpop .bar i{display:block;height:100%;background:var(--pri)}
#pgpop ul{list-style:none;margin:0 0 10px;padding:0}
#pgpop li{display:flex;gap:7px;align-items:center;padding:2px 0;color:var(--ink2)}
#pgpop li .ico{width:15px;height:15px;color:var(--line2)}
#pgpop li.y .ico{color:var(--pri)}
#pgpop .row{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:10px;margin-top:6px}

/* ---------- 窄屏 ---------- */
@media (max-width:1080px){
  #side{transform:translateX(-100%);transition:transform .2s;background:#fff;box-shadow:none;z-index:45}
  body.side-open #side{transform:none;box-shadow:0 0 40px rgba(22,32,64,.2)}
  body.side-open #scrim{display:block;position:fixed;inset:56px 0 0 0;background:rgba(20,26,40,.25);z-index:44}
  #view{margin-left:0;padding:72px 18px 50px}
  #btn-menu{display:inline-flex}
}
@media (max-width:860px){ .tb .t{display:none} .tb{padding:0 10px} #brand small{display:none} }

  #search{max-width:none}

  .ph{padding:18px 16px 14px} .ph h1{font-size:23px}

/* ---------- 演示通用 ---------- */
.hint{font-size:12.5px;color:var(--ink3)}
.split{display:grid;grid-template-columns:minmax(210px,.85fr) 1.6fr;gap:14px;align-items:start}
@media (max-width:700px){.split{grid-template-columns:1fr}}
.three{display:grid;grid-template-columns:1fr 1.1fr 1fr;gap:10px}
@media (max-width:640px){.three{grid-template-columns:1fr}}
.cbox{border:1.5px solid var(--line2);border-radius:10px;padding:10px 12px;min-height:120px;background:#fff;transition:border-color .25s}
.cbox h5{margin:0 0 8px;font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cbox h5 .ico{width:16px;height:16px;color:var(--pri)}
.cbox.wiped{border-style:dashed;border-color:var(--bad);background:var(--bad-l)}
.chipx{display:block;padding:4px 9px;margin:5px 0;border-radius:7px;border:1px solid var(--line2);background:var(--pri-ll);font-size:13px;line-height:1.5;animation:chipin .35s ease-out}
.chipx small{color:var(--ink3)}
.chipx.plain{background:#fff}
.chipx.ok{border-color:var(--ok);background:var(--ok-l);color:var(--ok);font-weight:600}
.chipx.bad{border-color:var(--bad);background:var(--bad-l);color:var(--bad);font-weight:600}
@keyframes chipin{from{opacity:0;transform:translateY(-4px)}}
.cbox .empty,.empty{display:block;font-size:12.5px;color:var(--ink3);padding:4px 2px}
.cbox .sub{display:block;font-size:11.5px;color:var(--ink3);margin-top:8px}
@media (prefers-reduced-motion:reduce){.chipx{animation:none}}

/* 提交历史 */
circle.cm{fill:#fff;stroke:var(--ink2);stroke-width:2}
circle.cb{fill:var(--pri-l);stroke:var(--pri);stroke-width:2}
circle.cg{fill:#fff;stroke:var(--line2);stroke-width:1.5;stroke-dasharray:3 3}
g.dim{opacity:.4!important}

/* 参与者图 */
svg.actors .acct rect{fill:#FAFBFD;stroke:#B9BFCC;stroke-width:1.2;stroke-dasharray:6 4;transition:fill .25s,stroke .25s}
svg.actors .al1{font-size:12.5px;font-weight:700;fill:var(--ink2)}
svg.actors .al2{font-size:11px;fill:var(--ink3)}
svg.actors.v-acct .acct rect{fill:var(--pri-ll);stroke:var(--pri);stroke-width:1.6}
svg.actors.v-acct .ae{opacity:.18}
svg.actors .ae{fill:none;stroke:var(--ink3);stroke-width:1.4;transition:opacity .25s,stroke .25s}
svg.actors .ae.on{stroke:var(--pri);stroke-width:2.4}
svg.actors.has-sel .ae:not(.on){opacity:.25}
svg.actors .an{cursor:pointer}
svg.actors .an .abx{fill:#fff;stroke:#9AA2B3;stroke-width:1.2;transition:fill .25s,stroke .2s}
svg.actors.v-model .an .abx{fill:var(--mf)}
svg.actors .an .astk{fill:#fff;stroke:#C6CBD5}
svg.actors .an .ap{fill:var(--author-l);stroke:var(--author);stroke-width:1.6}
svg.actors .an1{font-size:13.5px;font-weight:700;fill:var(--ink)}
svg.actors .an2{font-size:11.5px;fill:var(--ink2)}
svg.actors .an:hover .abx,svg.actors .an:focus .abx{stroke:var(--pri)}
svg.actors .an.sel .abx{stroke:var(--pri);stroke-width:2.6}
svg.actors.has-sel .an:not(.lit):not(.sel){opacity:.45}
.det table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:10px;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.det th{width:120px;text-align:left;background:var(--pri-ll);color:var(--ink2);font-weight:600;padding:6px 10px;vertical-align:top;border-bottom:1px solid var(--line);font-size:12.5px}
.det td{padding:6px 10px;border-bottom:1px solid var(--line);word-break:break-all}

/* 谁说了算 */
.qpane{min-height:180px}
.qtitle{font-weight:700;font-size:15px;margin-bottom:6px}
.reveal .rrow,.qpane .rrow{display:flex;gap:10px;align-items:flex-start;margin:6px 0;font-size:13.5px}
.rrow>span{flex:none;width:64px;font-size:12px;color:var(--ink3);padding-top:2px}
.rrow small{color:var(--ink2)}
.rnote{font-size:13px;color:var(--ink2);margin:8px 0 0;padding-top:8px;border-top:1px dashed var(--line2)}
.plinks{display:flex;flex-wrap:wrap;gap:6px}
.plinks a{display:inline-flex;align-items:center;gap:5px;padding:1px 9px 1px 4px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:13px;color:var(--ink)}
.plinks a b{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:4px;background:var(--pri-ll);color:var(--pri);font-size:11px}
.plinks a:hover{border-color:var(--pri);text-decoration:none}

/* 事归谁 */
svg.router .rhd{font-size:12px;fill:var(--ink3);font-weight:600}
svg.router .rjb{fill:#fff;stroke:var(--line2);transition:fill .2s,stroke .2s}
svg.router .rj{cursor:pointer}
svg.router .rjt{font-size:13px;fill:var(--ink)}
svg.router .rj:hover .rjb,svg.router .rj:focus .rjb{stroke:var(--pri)}
svg.router .rj.sel .rjb{fill:var(--pri-l);stroke:var(--pri);stroke-width:1.8}
svg.router .rj.done .rjt{fill:var(--ink2)}
svg.router .dia{fill:var(--opus);opacity:0;transition:opacity .2s}
svg.router.aes .rj.isaes .dia{opacity:1}
svg.router .rlb{fill:#fff;stroke:var(--line2);transition:fill .2s,stroke .2s}
svg.router .rlt{font-size:13px;fill:var(--ink);font-weight:600}
svg.router .rl.on .rlb{stroke:var(--pri);stroke-width:2;fill:var(--pri-ll)}
svg.router .rl.wrong .rlb{stroke:var(--bad);fill:var(--bad-l)}
svg.router .rl.clickable{cursor:pointer}
svg.router .rl.clickable .rlb{stroke-dasharray:4 3;stroke:var(--pri)}
svg.router .redl{stroke:var(--bad);stroke-width:3;opacity:0;transition:opacity .2s}
svg.router.aes .redl{opacity:1}
svg.router .rc{fill:none;stroke:#C2C7D2;stroke-width:1.3;transition:stroke .2s,opacity .2s}
svg.router .rc.on{stroke:var(--pri);stroke-width:2.4}
svg.router .rc.off{opacity:.3}
svg.router .rct{font-size:11.5px;fill:var(--pri);font-weight:700}

/* 主会话的分发 */
.tri{display:grid;grid-template-columns:230px 1fr;gap:12px;align-items:start}
@media (max-width:700px){.tri{grid-template-columns:1fr}}
.inbox{min-height:110px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.dbox{border:1px solid var(--line2);border-radius:9px;padding:7px 9px;background:#fff;min-height:64px;transition:border-color .2s,box-shadow .2s}
.dbox:first-child{grid-column:1/-1}
.dbox .dh{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;margin-bottom:4px}
.dbox .dh i{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.dbox .dh small{color:var(--ink3);font-size:11.5px}
.dbox.hit{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri-l)}
.dbox.ask{cursor:pointer;border-style:dashed;border-color:var(--pri)}
.dbox.ask:hover{background:var(--pri-ll)}
.dl{display:flex;flex-wrap:wrap;gap:4px}
.tchip{display:inline-block;font-size:12px;line-height:1.45;padding:2px 7px;border-radius:6px;background:var(--pri-ll);border:1px solid var(--line2);max-width:100%}
.tchip.cur{display:block;font-size:13.5px;padding:8px 10px;background:#fff;border:1.5px solid var(--pri);font-weight:600}

/* 分段开工 */
.wgrid{display:grid;grid-template-columns:72px repeat(3,minmax(150px,1fr)) minmax(120px,.7fr);gap:6px;min-width:680px}
.wh{font-weight:700;font-size:13.5px;text-align:center;padding:5px;border-radius:8px;background:#fff;border:1px solid var(--line);color:var(--ink2)}
.wh.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.wh.past{color:var(--ink3)}
.wc0{font-size:12.5px;font-weight:600;color:var(--ink2);display:flex;align-items:center;gap:6px}
.wc0 i{width:9px;height:9px;border-radius:50%}
.wcell{border:1px solid var(--line);border-radius:9px;padding:6px;background:#fff;display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start;min-height:56px;transition:opacity .25s,border-color .25s}
.wcell.future{opacity:.45}

    const bPrev = UI.btn(IC.prev, '上一步', '退回上一个状态', () => go(i - 1));

  /* 正交折线转圆角路径 */
  roundPath(pts, r = 8) {
    const P = pts.filter((p, k) => k === 0 || p[0] !== pts[k - 1][0] || p[1] !== pts[k - 1][1]);
    let d = `M${P[0][0]},${P[0][1]}`;
    for (let k = 1; k < P.length - 1; k++) {
      const [x0, y0] = P[k - 1], [x1, y1] = P[k], [x2, y2] = P[k + 1];
      const l1 = Math.hypot(x1 - x0, y1 - y0), l2 = Math.hypot(x2 - x1, y2 - y1);
      const rr = Math.min(r, l1 / 2, l2 / 2);
      const ax = x1 - (x1 - x0) / l1 * rr, ay = y1 - (y1 - y0) / l1 * rr;
      const bx = x1 + (x2 - x1) / l2 * rr, by = y1 + (y2 - y1) / l2 * rr;
      d += ` L${ax},${ay} Q${x1},${y1} ${bx},${by}`;
    }
    const L = P[P.length - 1];
    return d + ` L${L[0]},${L[1]}`;
  },

  }
};

/* ---------- 演示的生命周期 ---------- */
let LIVE = [], IO = null;
function makeCtx() {
  const timers = new Set(), ints = new Set(), offs = [];
  const ctx = {
    dead: false, rm: APP.rm,
    after(ms, fn) { const t = setTimeout(() => { timers.delete(t); if (!ctx.dead) fn(); }, ms); timers.add(t); return t; },
    every(ms, fn) { const t = setInterval(() => { if (!ctx.dead && !document.hidden) fn(); }, ms); ints.add(t); return t; },
    clear(t) { clearTimeout(t); clearInterval(t); timers.delete(t); ints.delete(t); },
    on(tg, ev, fn, o) { tg.addEventListener(ev, fn, o); offs.push(() => tg.removeEventListener(ev, fn, o)); },
    ends: [],
    destroy() { ctx.dead = true; timers.forEach(clearTimeout); ints.forEach(clearInterval); offs.forEach(f => f()); ctx.ends.forEach(f => { try { f(); } catch (e) { /* 忽略 */ } }); }
  };
  return ctx;
}
function buildFrame(f) {
  const d = APP.DEMOS[f.dataset.demo];
  if (!d) { f.textContent = '（缺少演示：' + f.dataset.demo + '）'; return; }
  f.setAttribute('aria-label', d.title);
  f.append(
    h('div', { class: 'fh' }, h('h3', { text: d.title }), d.kind ? h('span', { class: 'tag', text: d.kind }) : null),
    h('p', { class: 'goal', html: '<b>观察目标</b>' + d.goal }),
    h('div', { class: 'fb' }),
    h('figcaption', { html: '<b>图注</b>　' + d.caption })
  );
}
function initFig(f) {
  const d = APP.DEMOS[f.dataset.demo]; if (!d || f.dataset.ready) return;
  f.dataset.ready = '1';
  const ctx = makeCtx(); LIVE.push(ctx);
  try { d.init($('.fb', f), ctx); } catch (err) { console.error(err); $('.fb', f).textContent = '演示加载失败：' + err.message; }
}
/* 图第一次接近可见时才初始化：观察器与滚动检查并用，哪个先到用哪个 */
function mountFigures(root) {
  const figs = $$('figure.fig[data-demo]', root);
  figs.forEach(buildFrame);
  let pending = figs.slice();
  const near = f => { const r = f.getBoundingClientRect(); return r.width > 0 && r.top < window.innerHeight + 240 && r.bottom > -240; };
  const check = () => { pending = pending.filter(f => { if (f.dataset.ready) return false; if (near(f)) { initFig(f); return false; } return true; }); };
  const ctx = makeCtx(); LIVE.push(ctx);
  let t = 0;
  const onScroll = () => { if (!t) t = ctx.after(50, () => { t = 0; check(); }); };
  ctx.on(window, 'scroll', onScroll, { passive: true });
  ctx.on(window, 'resize', onScroll);
  if ('IntersectionObserver' in window) {
    IO = new IntersectionObserver(ents => { ents.forEach(en => { if (en.isIntersecting) { IO.unobserve(en.target); initFig(en.target); } }); }, { rootMargin: '240px 0px' });
    figs.forEach(f => IO.observe(f));
  }
  check();
}
function teardown() { LIVE.forEach(c => c.destroy()); LIVE = []; if (IO) { IO.disconnect(); IO = null; } closePop(); hideTip(); }
APP.mountDemoInto = (el, id) => { const ctx = makeCtx(); LIVE.push(ctx); APP.DEMOS[id].init(el, ctx); };

function placeNear(card, r) {

  let top = r.bottom + 8; if (top + ch > vh - m) top = r.top - ch - 8; if (top < m) top = Math.min(vh - ch - m, r.bottom + 8);
  let left = r.left + r.width / 2 - cw / 2; left = Math.max(m, Math.min(left, vw - cw - m));

    g.addEventListener('mouseenter', () => { if (lastPointer !== 'touch') focus(id); });
    g.addEventListener('mouseleave', () => { if (lastPointer !== 'touch') clear(); });
    g.addEventListener('focus', () => focus(id));
    g.addEventListener('click', () => {
      if (lastPointer === 'touch' && touchArmed !== id) { touchArmed = id; focus(id); return; }
      location.hash = '#/p/' + id;
    });
    g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); location.hash = '#/p/' + id; } });
  });
  clear();
  return {
    clear,
    filter(k) {
      svg.classList.toggle('filt', !!k);
      APP.PAGES.forEach(p => { const has = !!k && (p._tags || []).includes(k); nodes[p.id].classList.toggle('fi', has); nodes[p.id].classList.toggle('fo', !!k && !has); });
    },
    expand(steps, upto) {
      svg.classList.remove('focus');
      if (!steps) { svg.classList.remove('exp'); Object.values(nodes).forEach(g => g.classList.remove('e0', 'e1', 'e2')); edges.forEach(e => e.classList.remove('e')); return; }
      svg.classList.add('exp');
      const lit = new Set();
      Object.values(nodes).forEach(g => g.classList.remove('e0', 'e1', 'e2'));
      steps.slice(0, upto + 1).forEach((st, k) => st.forEach(id => { lit.add(id); nodes[id].classList.add(k === 0 ? 'e0' : k === upto ? 'e1' : 'e2'); }));
      edges.forEach(e => e.classList.toggle('e', lit.has(e.dataset.a) && lit.has(e.dataset.b)));
    }
  };
}

let SIDX = [];
function buildSearchIndex() {
  SIDX = [];
  APP.PAGES.forEach(p => {
    SIDX.push({ cat: '知识页', title: p.title, sub: p.brief, href: '#/p/' + p.id, num: p.n, text: p.title + ' ' + p.brief + ' ' + (p.src || '') });
    const tpl = document.createElement('template'); tpl.innerHTML = p.html;
    $$('section[id]', tpl.content).forEach(s => {
      const t = $('h2 .h', s); if (!t) return;
      const plain = s.textContent.replace(/\s+/g, ' ');
      SIDX.push({ cat: '小节', title: t.textContent, sub: `${p.n} ${p.title}`, href: `#/p/${p.id}/${s.id}`, num: p.n, text: t.textContent + ' ' + plain });
    });
    (p.glossary || []).forEach(g => SIDX.push({ cat: '术语', title: `${g[0]}（${g[1]}）`, sub: `${p.n} ${p.title} · 词汇表`, href: `#/p/${p.id}/glossary`, text: g[0] + ' ' + g[1] }));
  });
  APP.QREF.forEach(q => SIDX.push({ cat: '速查条目', title: q.name, sub: q.body.replace(/<[^>]+>/g, ''), href: '#/ref/' + q.id, type: q.type, text: q.name + ' ' + q.body.replace(/<[^>]+>/g, '') }));
}
function markHit(s, k) {
  if (!k) return esc(s);
  const i = s.toLowerCase().indexOf(k.toLowerCase());
  if (i < 0) return esc(s);
  return esc(s.slice(0, i)) + '<mark>' + esc(s.slice(i, i + k.length)) + '</mark>' + esc(s.slice(i + k.length));
}
function snippet(s, k, n = 46) {
  const i = s.toLowerCase().indexOf(k.toLowerCase());
  if (i < 0 || s.length <= n) return s.slice(0, n) + (s.length > n ? '…' : '');
  const a = Math.max(0, i - 14); return (a > 0 ? '…' : '') + s.slice(a, a + n) + (a + n < s.length ? '…' : '');
}
function setupSearch() {
  const q = $('#q'), box = $('#sres');
  let items = [], sel = -1;
  const ORDER = ['知识页', '小节', '速查条目', '术语'];
  function render() {
    const k = q.value.trim();
    box.innerHTML = ''; items = []; sel = -1;
    if (!k) {
      box.append(h('div', { class: 'grp', text: '快速入口' }));
      APP.HOME.quick.forEach(([t, href, sub]) => { const a = h('a', { class: 'it', href, html: `<span><span class="tt">${esc(t)}</span><span class="sub">${esc(sub)}</span></span>` }); box.append(a); items.push(a); });
    } else {
      const hits = SIDX.filter(x => x.text.toLowerCase().includes(k.toLowerCase()));
      hits.sort((a, b) => (b.title.toLowerCase().includes(k.toLowerCase()) - a.title.toLowerCase().includes(k.toLowerCase())));
      if (!hits.length) box.append(h('div', { class: 'empty', text: `没有找到"${k}"。换个说法，或去速查页按类型浏览。` }));
      ORDER.forEach(cat => {
        const g = hits.filter(x => x.cat === cat).slice(0, cat === '小节' ? 6 : 6); if (!g.length) return;
        box.append(h('div', { class: 'grp', text: cat }));
        g.forEach(x => {
          const sub = x.cat === '小节' || x.cat === '知识页' ? (x.title.toLowerCase().includes(k.toLowerCase()) ? x.sub : snippet(x.text.replace(x.title, '').trim(), k)) : snippet(x.sub, k);
          const a = h('a', { class: 'it', href: x.href, role: 'option', html: (x.num ? `<span class="num">${x.num}</span>` : x.type ? qtag(x.type) : '') + `<span><span class="tt">${markHit(x.title, k)}</span><span class="sub">${markHit(sub, k)}</span></span>` });
          box.append(a); items.push(a);
        });
      });
    }
    box.append(h('div', { class: 'hint', text: '↑ ↓ 选择　Enter 打开　Esc 清空或关闭　/ 聚焦搜索' }));
    items.forEach(a => a.addEventListener('mousedown', e => e.preventDefault()));
    items.forEach(a => a.addEventListener('click', () => closeSearch(true)));
  }
  function openBox() { render(); box.hidden = false; q.setAttribute('aria-expanded', 'true'); }
  function closeSearch(clear) { box.hidden = true; q.setAttribute('aria-expanded', 'false'); if (clear) q.value = ''; document.body.classList.remove('sopen'); q.blur(); }
  q.addEventListener('focus', openBox);
  q.addEventListener('input', openBox);
  q.addEventListener('blur', () => setTimeout(() => { if (document.activeElement !== q) { box.hidden = true; document.body.classList.remove('sopen'); } }, 120));
  q.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault(); if (!items.length) return;
      sel = (sel + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
      items.forEach((a, i) => a.classList.toggle('on', i === sel)); items[sel].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter') {
      const a = items[sel >= 0 ? sel : 0]; if (a) { location.hash = a.getAttribute('href'); closeSearch(true); }
    } else if (e.key === 'Escape') {
      if (q.value) { q.value = ''; render(); } else closeSearch(false);
    }
  });
  $('#btn-search').addEventListener('click', () => { document.body.classList.add('sopen'); q.focus(); });
  document.addEventListener('keydown', e => {
    if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test((document.activeElement || {}).tagName || '')) { e.preventDefault(); if (window.innerWidth <= 520) document.body.classList.add('sopen'); q.focus(); }
  });
}

/* ---------- 全局事件 ---------- */
function setupGlobal() {
  document.addEventListener('pointerdown', e => { lastPointer = e.pointerType || 'mouse'; }, true);
  document.addEventListener('mouseover', e => {
    if (lastPointer === 'touch') return;
    const el = e.target.closest && e.target.closest('[data-tip]');
    if (el && el !== tipOwner) showTip(el); else if (!el && tipOwner && document.activeElement !== tipOwner) hideTip();
  });
  document.addEventListener('focusin', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el && lastPointer !== 'touch') showTip(el); });
  document.addEventListener('focusout', e => { if (tipOwner && e.target === tipOwner) hideTip(); });
  document.addEventListener('click', e => {
    const q = e.target.closest('.qlink,.qbadge');
    if (q) { e.preventDefault(); const en = APP.qById[q.dataset.q]; if (popOwner === q) closePop(); else openPop(q, en); hideTip(); return; }
    if (!e.target.closest('#pop')) closePop();
    if (lastPointer === 'touch') {
      const el = e.target.closest('[data-tip-tap]');
      if (el) { if (tipOwner === el) hideTip(); else showTip(el); } else if (tipOwner) hideTip();
    }
    if (!e.target.closest('#pgpop,#btn-progress')) PGPOP.hidden = true;
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { hideTip(); closePop(); PGPOP.hidden = true; document.body.classList.remove('side-open'); }
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.lv[data-tip-tap]')) { e.preventDefault(); tipOwner === e.target ? hideTip() : showTip(e.target); }
  });
  window.addEventListener('scroll', () => { if (tipOwner) hideTip(); if (popOwner && POP.getBoundingClientRect) { const r = popOwner.getBoundingClientRect(); if (r.bottom < 56 || r.top > window.innerHeight) closePop(); else placeNear(POP, r); } }, { passive: true });
  window.addEventListener('resize', () => { hideTip(); closePop(); });
  $('#btn-menu').addEventListener('click', () => document.body.classList.toggle('side-open'));
  $('#scrim').addEventListener('click', () => document.body.classList.remove('side-open'));
  $('#btn-progress').addEventListener('click', openProgress);
  window.addEventListener('hashchange', route);
}

<h1>ENG-TEAM 多模型协作规程<small>一份把协作规程讲透的知识图谱</small></h1>
<p>ENG-TEAM 是《电光年华》开发期的协作规程：规定作者、主会话、二号会话、Astra 和两个 Sol 会话这些参与者怎么分工、怎么交接、额度怎么用，一个工作包怎样从派工走到合入。它是一份<b>流程规程</b>，容易和几份相邻文档混淆：包的划分与交付在 ENG-WP，git 工作树与合并的命令细节在 ENG-ARCH §6，子代理的工作规则在 ENG-ONBOARD，测试与回报格式在 ENG-GATES，此刻的施工进度在 ENG-STATUS。</p>
<p>本网页把规程拆成 18 个知识点，按理解上的依赖连成下面的图谱：可以从通用基础一路读到规程全景，也可以从任何一页单独进入复习。<b>所有规则以 ENG-TEAM.md 原文为准</b>；讲解文字是口语化的转述，关键规定附了"规程原文"框。</p>`;

(function () {
const U = APP.UI, IC = APP.IC;

/* ======================= 1 大模型会话与子代理 ======================= */
APP.page({
  id: 'session', layer: 'L1', title: '大模型会话与子代理', src: '通用基础（规程 §1、§6.6 用到）',
  brief: '会话是一个模型带着自己的上下文连续工作的过程；子代理是会话在后台另开的会话。规程里的每个参与者都是会话。',
  prereq: [],
  html: `
<p class="lead">ENG-TEAM 管的不是"人"，而是一个个大模型会话。读规程之前，先弄清三件事：会话是什么，子代理是什么，会话的记忆丢了以后靠什么接着干。后面每一页都建立在这三件事上。</p>

<section id="s-sess"><h2><span class="h">会话与上下文</span>${T('base', '大模型代理工程', '会话与上下文是代理系统里最底层的对象，理解任何代理协作都从它们开始')}</h2>
<p>${hl('会话（session）是一个大模型在一套工具环境里连续工作的过程')}：它读文件、跑命令、改代码，每一步的输入和结果都留在它的上下文（context）里。上下文就是模型此刻"记得"的全部内容，容量有限。</p>
<p>开一个会话时就定下两件事：用哪个模型，开多大的推理强度（reasoning effort）。推理强度越高，模型每一步想得越多，也越耗额度。规程里 Astra 和两个 Sol 会话写的"xhigh"，就是 Codex 侧的一档推理强度设置。</p>
<p>会话有两种运行方式。交互会话（interactive session）有人在终端里和它对话；后台会话（background session）由脚本或别的会话叫起来干活。规程里两种都有：主会话是交互会话，两个 Sol 会话由唤醒脚本按需叫醒。</p>
</section>

<section id="s-sub"><h2><span class="h">子代理</span>${T('core', '大模型代理工程', '父会话把任务拆给子代理并行，是代理编排的主干做法；规程的分工全靠它展开')}</h2>
<p>${hl('子代理（subagent）是一个会话在后台另开的会话')}。父会话把任务写成一段简报（brief）交给它；子代理在自己的上下文里独立工作，做完把结果回报给父会话。</p>
<p>这样做有两个好处：几件事可以同时推进；父会话的上下文不会被施工细节塞满，可以留给判断。代价是每个子代理都在消耗所在账号的额度。</p>
<p>子代理只认简报，不知道父会话脑子里的其他东西。简报里没写的约束，它就不会遵守。所以规程要求简报写清工作树的绝对路径、先读什么、交付标准（规程 §5.2、§8.4）。</p>
</section>

<section id="s-reset"><h2><span class="h">上下文重置与外部记忆</span>${T('core', '大模型代理工程', '长任务一定会碰到上下文用尽或会话重启，把进度写到外部是常规的应对办法')}</h2>
<p>上下文会被清空：容量用尽后被压缩、会话被重启，或者换一个会话来接手。清空以后，模型只知道重新读进来的东西。</p>
<p>所以长期协作不能把"做到哪了"只放在对话里，${hl('要写进文件')}。文件不会随上下文消失，任何会话重新读一遍就能接着做。这种做法叫外部记忆（external memory）。下图对比两种做法在一次重置前后的差别。</p>
${fig('ctxreset')}
<p>两种模式走到第 4 步时处境一样：上下文都空了。差别出在第 5 步：写进任务单的一侧，读回"状态"就知道从第 3 步接着做；只记在对话里的一侧不知道做到哪，只能从头再来。规程把这个道理定成了硬规矩：${hl('任务单和请求文件是交接的唯一依据')}，任何一方上下文重置，都照它们接着做（§6）。</p>
</section>

<section id="s-pos" class="pos"><h2><span class="h">在项目中的位置</span></h2>
<ul>
<li>规程里的每个参与者都是一个会话：主会话、二号会话、Astra、Sol 值班会话、Sol 旁路会话，各自还开子代理（${pl('actors')}）。</li>
<li>它们用的模型不同：Claude Opus、Claude Sonnet、gpt-6-astra、gpt-6.1-sol。模型的长处和短板决定了分工（${pl('ability')}）。</li>
<li>上下文重置后各方先读什么，规程 §6.6 列了一张表（${pl('messages')}）。</li>
</ul>
</section>

<section id="s-sum" class="sum"><h2><span class="h">小结</span></h2>
<ul>
<li>会话是模型带着上下文连续工作的过程；上下文有限，会被清空。</li>
<li>子代理是会话在后台另开的会话，只认简报，做完向父会话回报。</li>
<li>长期协作把进度写进文件；规程据此规定任务单和请求文件是交接的唯一依据。</li>
</ul>
</section>`,

    }
    stp.go(0);
  }
});

APP.page({

  prereq: [],
  html: `
<p class="lead">规程里"建工作树""候选提交""squash""rebase"这些词都来自版本控制（version control）。本页只讲读懂规程所需的四件事：提交与分支、工作树、rebase、squash 合并。</p>

<section id="s-branch"><h2><span class="h">提交、分支与主线</span>${T('cross', '软件工程（版本控制）', '规程借用 Git 的基本概念，这里只讲到能读懂规程为止')}</h2>
<p>仓库的历史由一串提交（commit）组成，每个提交记下一次改动。分支（branch）是指向某个提交的可移动指针：在分支上提交，指针就往前走一格。</p>
<p>本项目的主线分支叫 main，所有包最终都要合进 main；推送到远端的也只有 main（§5.5）。施工方在自己分支上做出的、等待评审与合入的那个提交，规程叫它${hl('候选提交（candidate commit）')}。</p>
</section>

<section id="s-wt"><h2><span class="h">工作树</span>${T('cross', '软件工程（版本控制）', '工作树是 Git 的一项功能，规程用它隔离并行施工')}</h2>
<p>${hl('工作树（worktree）让同一个仓库同时在多个目录里检出不同的分支')}。几个子代理各用一个工作树，各改各的文件，互不干扰，却共享同一份提交历史。</p>
<p>仓库原本所在的那个目录叫主检出（main checkout）。main 上的合并在主检出上做；施工子代理不碰主检出（§8.4）。</p>
</section>

<section id="s-rebase"><h2><span class="h">rebase</span>${T('cross', '软件工程（版本控制）', 'rebase 是版本控制的常用操作，规程要求施工方在 main 变化后执行')}</h2>
<p>别的包合进 main 以后，main 往前走了，你的分支还长在旧的 main 上，这叫落后。${hl('rebase（变基）把你分支上的提交按顺序重放到新的 main 末端')}，分支就不再落后，之后合并时也少冲突。</p>
<p>判断是否落后很简单：看 main 是不是你分支的祖先。规程里值班会话巡检时，就用这个判断把落后的工作树列出来（§8.1）。</p>
</section>

<section id="s-squash"><h2><span class="h">squash 合并</span>${T('cross', '软件工程（版本控制）', 'squash 合并是常见的合并方式，规程的合并执行固定用它')}</h2>
<p>${hl('squash 合并（squash merge）把一个分支上的多个提交压成一个提交放到 main 上')}。main 的历史因此一个包一个提交，读起来清楚，出问题也好撤回。合并时如果和 main 上已有的改动冲突，就撤回这次合并（§5.5）。</p>
<p>下图把一个包的分支从建立走到合入，把上面四个概念串起来。</p>
${fig('gitflow')}
<p>第 3 步 main 前进以后，分支落后了；第 4 步 rebase 让三个提交换了"地基"，内容不变。第 5 步 squash 合入后，main 上只多出一个提交 S。第 6 步从新的 main 重建分支，工作树就可以接着做下一件事。</p>
</section>

<section id="s-pos" class="pos"><h2><span class="h">在项目中的位置</span></h2>
<ul>
<li>谁派的子代理谁建工作树：每个包一个工作树，没有包号的任务用 SN 编号（§5.2，见 ${pl('dispatch')}）。</li>
<li>施工方只在自己的分支上小步提交，不推送、不合并（§5.3）。</li>
<li>合并执行由 Sol 值班会话在主检出上用 squash 做；main 同一时刻只有一个执行人（§1.1、§5.5，见 ${pl('actors')}、${pl('merge')}）。</li>
<li>合入后，每个施工方开始下一步之前看合并日志，main 变了就 rebase（§5.6，见 ${pl('after')}）。</li>
</ul>
</section>

<section id="s-sum" class="sum"><h2><span class="h">小结</span></h2>
<ul>
<li>分支是可移动的提交指针；候选提交是等待评审与合入的那个提交。</li>
<li>工作树让多个子代理在不同目录里并行施工；合并只在主检出上做。</li>
<li>main 前进后分支落后，rebase 把分支接到新的 main 末端；squash 合并让 main 一包一提交。</li>
</ul>
</section>`,

    function draw(i) {

      panel.set('base', st.base); panel.set('behind', st.behind); panel.set('mc', st.mc); panel.set('bc', st.bc);
      exp.innerHTML = st.t;
    }
    stp.go(0);
  }
});

<section id="s-board"><h2><span class="h">共享目录交接</span>${T('core', '多代理协作', '共享工作区是多代理协作最常见的组织方式，后面的交接规则都以它为前提')}</h2>
<p>共享目录（shared directory）${hl('是所有参与者都能读写的一个文件夹')}：任务、请求、结论都写成文件放进去，谁接手谁去读。多代理系统里常把这种组织方式叫黑板（blackboard）。</p>
<p>和"互相发消息"相比，文件有两个好处：一是留痕，任何时候都能回看全过程；二是不依赖对方在线，对方上下文重置以后也能照文件接着做。消息仍然有用，但只做提醒——"某个文件有新内容了，去看"——细节都在文件里。</p>
</section>

<section id="s-append"><h2><span class="h">只追加与不覆盖创建</span>${T('core', '多代理协作', '多方写同一批文件时防止互相覆盖的两条基本做法')}</h2>
<p>几方同时写一批文件，最怕互相覆盖。两条做法可以避免：</p>
<ul>
<li>${hl('只追加（append-only）')}：已有内容不改写，新内容一律加在末尾，每条带时间。别人写过的东西永远在。</li>
<li>不覆盖创建（exclusive create）：新建文件时，如果同名文件已经存在，${hl('就让创建失败，而不是把它盖掉')}。失败了就换下一个编号，规程叫撞号顺延。</li>
</ul>
<p>第二条最容易被忽视：两方都按"现有最大号加一"取号时，取到的号可能一样。下图把这个过程拆开看。</p>
${fig('collide')}
<p>"直接写入"模式下，乙的写入把甲的文件整个盖掉了，甲还以为自己提交成功；"不覆盖创建"模式下，乙的创建失败，改用下一个号，两份申请都在。规程对请求文件的要求正是后一种（§6.2）。</p>
</section>

<section id="s-poll"><h2><span class="h">轮询与事件通知</span>${T('core', '多代理协作', '发现变化的两种基本方式，决定了唤醒脚本和消息的设计')}</h2>
<p>文件写好了，接收方怎么知道？有两种办法：</p>
<ul>
<li>轮询（polling）：${hl('每隔固定时间去查一次有没有新东西')}。简单可靠，代价是有延迟，最坏要等一个间隔才发现。</li>
<li>事件通知（event notification）：发生变化的一方主动说一句。及时，但要求对方能收到。</li>
</ul>
<p>规程两种都用：唤醒脚本每 20 秒轮询一次交接目录，有事才叫醒 Sol 会话；会话之间只在事件发生时发一句话，不发进度汇报，也不互相轮询（§6.4、§6.5）。</p>

<section id="s-pos" class="pos"><h2><span class="h">在项目中的位置</span></h2>
<ul>
<li>规程的交接目录是仓库外的 .collab，不进 git（§6.1、§6.2，见 ${pl('collab')}）。</li>
<li>所有文件只追加、不改写，每条带时间；唯一的例外是调研索引的"Opus 审计"一列（§6.2）。</li>
<li>请求文件序号取现有最大号加一，用不覆盖的写法创建；撞号时改用下一个号（§6.2）。</li>
<li>两个唤醒脚本每 20 秒查一次；消息只在事件发生时发（§6.4、§6.5，见 ${pl('messages')}）。</li>
</ul>
</section>

<section id="s-sum" class="sum"><h2><span class="h">小结</span></h2>
<ul>
<li>共享目录是协作的公共黑板，文件是依据，消息只是提醒。</li>
<li>只追加保住别人写过的内容；不覆盖创建加撞号顺延保住同时新建的文件。</li>
<li>轮询简单但有延迟，事件通知及时但要对方能收到；规程两种都用。</li>
</ul>

<section id="s-power"><h2><span class="h">决定权与执行人</span>${T('proj', '', '规程 §1.1 的权责划分，依据 ENG-ARCH §6 与 D-166')}</h2>
<p>${hl('主代理（main agent）只有一个，就是主会话')}。它决定五件事：</p>
${quote('§1.1', '<ul><li>合并队列：哪个候选、什么时候合；</li><li>main 上的提交和推送；</li><li>ENG-STATUS；</li><li>docs/design/ 改什么；</li><li>与作者沟通。</li></ul>')}
<p>"决定"和"动手"是分开的。上面不需要判断的执行部分——按批准合入、跑门禁、提交推送、写合并日志、维护 ENG-STATUS、巡检——由 Sol 值班会话做（§8.1）。为了不互相踩，${hl('main 同一时刻只有一个执行人')}：值班会话合并时，主会话和其他会话都不碰主检出的暂存区。</p>
<p>设计文档的撰写也可以派出去：需要 Opus 的撰写交二号会话的 Opus 子代理；Sol 只在任务单给出确切文字时按文打补丁。改动都在工作树里做，经批准合入。其他各方也各有定夺的范围：Astra 定契约、共享工程文件和工程上的取舍（§5.7）；画面与声音的取值、风格定案，以主会话的评审为准（§2.2）。</p>
<p>下面的小测把这些事一件件拆开：先猜谁说了算，再看谁动手。</p>
${fig('decide')}
<p>做完会发现："说了算"除了 Astra 管的工程取舍，几乎都落在主会话身上；"动手"则大多交给了 Sol 值班会话和子代理。主会话因此能把注意力只花在判断上（${pl('tiering')}）。</p>
</section>

      if (mode !== 'guess' || sel < 0 || guessed[sel] !== undefined) return;

      const reveal = i => mode === 'see' || guessed[i] !== undefined;

        c.p.style.display = vis ? '' : 'none'; if (c.tl) c.tl.style.display = vis && c.i === sel ? '' : 'none';

      if (sel < 0) { exp.innerHTML = mode === 'see' ? '点左边任意一行，看它连到谁、规程原文怎么写。' : '先点左边一行，再点右边你认为负责的一方。'; return; }
      const J = JOBS[sel];
      if (mode === 'guess' && guessed[sel] === undefined) { exp.innerHTML = `<b>${sel + 1}. ${esc(J.s)}</b>：点右边你认为负责的一方。`; return; }
      const res = mode === 'guess' ? (guessed[sel] === true ? '<span class="st okc">✓ 猜对了</span>　' : '<span class="st badc">✗ 不是这一方</span>　') : '';
      const whoTxt = J.to.length > 1 ? '二号会话的 Opus 子代理施工，主会话定值' : LANES[J.to[0][0]].name;

    }
    render();
  }
});

    const bNext = h('button', { type: 'button', class: 'btn pri', html: IC.next + '下一件' });
    const bReset = h('button', { type: 'button', class: 'btn', html: IC.reset + '重新开始' });

    el.append(h('div', { class: 'ctrls' }, bNext, bReset, tg), h('div', { class: 'stage plain', style: { padding: '12px' } }, h('div', { class: 'tri' }, inbox, grid)), cnt, exp);
    function chip(i) { return h('span', { class: 'tchip', text: (i + 1) + ' ' + INBOX[i][0] }); }
    function sync() {
      const kept = INBOX.slice(0, k).filter(x => x[1] === 0).length;

APP.demo('mergeorder', {
  title: '两个候选同时等着合',
  goal: '两个包的候选都批准了，值班会话先合哪个？',
  caption: '链条是 ENG-ARCH §6 的内核顺序，青色是 Astra 侧，橙色是 Opus 侧。题目随机从链条里取两个包，有时混进一个不在链条里的包。一次只合一个。',
  init(el, ctx) {
    const chain = h('div', { class: 'kchain' });
    const side = p => SEGS.some(s => s.astra.includes(p) || s.astra.includes(p + 'a')) ? 'astra' : 'opus';
    const kEls = KORDER.map((p, i) => { const e = h('span', { class: 'kc ' + side(p), html: `<b>${i + 1}</b>${p}` }); chain.append(e); if (i < KORDER.length - 1) chain.append(h('span', { class: 'ka', html: IC.next })); return e; });
    const qbox = h('div', { class: 'qbox' });
    const bNew = h('button', { type: 'button', class: 'btn', html: IC.reset + '换一题' });
    const exp = U.explain();
    el.append(h('div', { class: 'stage plain', style: { padding: '12px' } }, chain), h('div', { class: 'ctrls', style: { marginTop: '10px' } }, qbox, bNew), exp);
    let seed = 7;
    const rnd = n => { seed = (seed * 9301 + 49297) % 233280; return Math.floor(seed / 233280 * n); };
    const OTHERS = ['WP-24', 'WP-15', 'WP-36', 'WP-10'];
    function ask() {
      kEls.forEach(e => e.classList.remove('hi', 'lo'));
      let a = rnd(KORDER.length), b = rnd(KORDER.length); while (b === a) b = rnd(KORDER.length);
      let pa = KORDER[a], pb = KORDER[b];
      if (rnd(4) === 0) pb = OTHERS[rnd(OTHERS.length)];
      const opts = rnd(2) ? [pa, pb] : [pb, pa];
      qbox.innerHTML = '';
      const qz = h('div', { class: 'quiz' }, h('span', { class: 'qq', html: `<b>${opts[0]}</b> 和 <b>${opts[1]}</b> 的候选都有批准行。先合哪个？` }));
      opts.forEach((o, j) => { const btn = h('button', { type: 'button', text: o }); btn.addEventListener('click', () => answer(opts, j, qz), { once: true }); qz.append(btn); });
      qbox.append(qz);
      exp.innerHTML = '选一个。';
    }
    function answer(opts, j, qz) {
      const ia = KORDER.indexOf(opts[0]), ib = KORDER.indexOf(opts[1]);
      let right;
      if (ia >= 0 && ib >= 0) right = ia < ib ? 0 : 1; else right = ia >= 0 ? 0 : 1;
      $$('button', qz).forEach((b, k) => { b.disabled = true; if (k === right) b.classList.add('right'); else if (k === j) b.classList.add('wrong'); });
      [ia, ib].forEach((x, k) => { if (x >= 0) kEls[x].classList.add(k === right ? 'hi' : 'lo'); });
      const other = ia < 0 ? opts[0] : ib < 0 ? opts[1] : null;
      exp.innerHTML = (j === right ? '<span class="st okc">✓ 对</span>　' : '<span class="st badc">✗ 反了</span>　') + (other ? `${other} 不在内核顺序里：其余包门禁通过就合，所以先合链条上的 ${opts[right]}，${other} 排在它后面单独合。` : `链条上 ${opts[right]} 在前（第 ${Math.min(ia, ib) + 1} 位），先合上游包。一次合一个。`);
    }
    bNew.addEventListener('click', ask);
    ask();
  }
});

<p>${hl('各方经仓库外的交接目录 .collab 交接；任务单和请求文件是唯一依据，消息只是提醒')}。目录的完整位置是 E:\\Project\\UESTC_RPG.wt\\.collab\\。下图是它的结构：选一个参与者，看它要写哪些文件；点一个文件，看规程对它的规定。</p>
${fig('tree')}
<p>几个规律：任务单（tasks）都由主会话建，执行方只在末尾写"状态"；请求文件（requests）由施工的负责方写，主会话在末尾写评审和批准；两个 Sol 会话的产出集中在 side、research 和合并日志；唤醒脚本只写自己的记录目录。</p>
</section>

<section id="s-write"><h2><span class="h">命名与写法</span>${T('proj', '', '规程 §6.2')}</h2>
${quote('§6.2', '<ul><li>.collab 在仓库之外，不进 git。</li><li>所有文件只追加、不改写；每条带时间；路径一律写绝对路径。唯一的例外是 research/INDEX.md 的"Opus 审计"一列：旁路会话做完一单时标"待审"，主会话审计后改写。</li><li><b>请求文件</b>：序号取现有最大号加一，用不覆盖的写法创建（例如 bash 先 set -C 再重定向，或先确认文件不存在）；撞号时改用下一个号，不覆盖别人的文件。</li><li><b>任务单</b>：max-&lt;nnn&gt;、sol-&lt;nnn&gt;、调研单 r&lt;nnn&gt;、旁路单 s&lt;nnn&gt; 都是三位编号递增，新建前确认没被占用。</li></ul>')}
<p>这就是只追加和不覆盖创建落到了具体文件上：所有文件${hl('只追加、不改写')}，请求文件的序号取${hl('现有最大号加一')}，撞号顺延。</p>
</section>

<section id="s-format"><h2><span class="h">任务单与请求文件的格式</span>${T('proj', '', '规程 §6.3')}</h2>
<p>四种单子的骨架不同，但遵守同一个模式：${hl('正文写清要做什么，末尾的小节由执行方追加')}。</p>
<div class="cards c2">
<div class="card"><h4>${IC.file}max 任务单</h4>正文写 §5.2 列的五项。末尾依次是：<br>"状态"小节：二号会话追加，一行一事，带时间：派出（子代理名与模型）、受阻（原因、需要谁定）、待评审（候选提交、截图路径、要定的问题）、已按评审修改。<br>"Opus 评审（时间）"小节：主会话写，通过或逐条修改意见。<br>批准行。</div>
<div class="card"><h4>${IC.file}sol 任务单</h4>正文写任务、做法和不许做的事；末尾"状态"小节由值班会话追加，一行一事，带时间。</div>
<div class="card"><h4>${IC.file}旁路单</h4>正文写在哪做、交付什么、能改什么、哪些不许做；末尾"状态"小节由旁路会话写过程与结果。调研单的写法见 §8.2。</div>
<div class="card"><h4>${IC.file}请求文件</h4>正文按 §6.1 的"写什么"一列；后续各方只在末尾追加，每条带时间和署名。</div>
</div>
</section>

<section id="s-approve"><h2><span class="h">批准行</span>${T('proj', '', '规程 §6.3 的批准行格式')}</h2>
<p>批准行是整套流程里最"机械"的一行：唤醒脚本靠它决定要不要叫醒值班会话。</p>
${quote('§6.3', '<ul><li>格式：批准合入：&lt;候选提交或说明&gt;，Opus，&lt;时间&gt;，后面可以接括号里的门禁组合或条件。</li><li>写在合并请求或任务单的末尾，单独成行，行首就是"批准合入："，前面不加列表符号或空格。唤醒脚本按行首匹配，行首不对就叫不醒值班会话。</li><li>合入后，值班会话在同一文件末尾追加"已合入：main=&lt;短号&gt;，&lt;时间&gt;，Sol 值班会话"。</li></ul>')}
<p>${hl('行首必须就是"批准合入："')}，这一点最容易出错。下面几行都是示例，判断唤醒脚本能不能认出它们。</p>
${fig('approve')}
<p>唤醒脚本只看行首，不理解内容：前面多一个列表符号或空格，就等于没写；反过来，行首对了就会叫醒值班会话，至于括号里的条件满没满足，由值班会话自己判断，没满足就不合，每次巡检复查（§5.5、§8.1）。</p>
</section>

<section id="s-pos" class="pos"><h2><span class="h">在项目中的位置</span></h2>
<ul>
<li>开发流程的每一步都在这些文件上留下产出（${pl('dispatch')}、${pl('merge')}）。</li>
<li>唤醒脚本盯的就是这里的批准行、sol 任务单和 side/cards（${pl('messages')}）。</li>
<li>主会话移交时的交接单 HANDOVER.md 也在这里（${pl('handover')}）。</li>
</ul>
</section>

<section id="s-sum" class="sum"><h2><span class="h">小结</span></h2>
<ul>
<li>.collab 在仓库之外、不进 git；任务单和请求文件是唯一依据。</li>
<li>每个文件有固定的写入方；所有文件只追加、带时间、写绝对路径；编号递增，撞号顺延。</li>
<li>单子末尾由执行方追加；批准行单独成行，行首就是"批准合入："。</li>
</ul>

APP.demo('tree', {
  title: '.collab 交接目录',
  goal: '某个参与者要写哪些文件？某个文件由谁写、写什么？',
  caption: '左边是目录结构（文件名里的尖括号是占位，如 &lt;nnn&gt; 是三位编号）；右边是选中文件在规程 §6.1 表里的"谁写"与"写什么"。上方选一个写入方，能写的文件会加粗标出；"任何代理"指所有会话与子代理都可以提契约申请。二号会话写交接单仅限它作为接任方交回时。',
  init(el, ctx) {
    let who = null, sel = TREE[0].kids[0];
    const W = ['main', 'second', 'astra', 'mainsub', 'any', 'duty', 'side', 'script'];
    const chips = h('div', { class: 'fchips wchips' }, h('span', { text: '谁写：' }));
    const cbs = W.map(k => { const b = h('button', { type: 'button', class: 'wb', html: who_html(k), 'aria-pressed': 'false' }); b.addEventListener('click', () => { who = who === k ? null : k; draw(); }); chips.append(b); b.dataset.k = k; return b; });
    function who_html(k) { return window.who(k); }
    const tree = h('div', { class: 'tree', role: 'tree' });
    const det = h('div', { class: 'tdet' });
    const fileEls = [];
    function build(list, depth, host) {
      list.forEach(n => {
        if (n.d) {
          host.append(h('div', { class: 'tn dir', style: { paddingLeft: (depth * 18 + 6) + 'px' }, html: IC.folder + esc(n.d) + '/' }));
          build(n.kids, depth + 1, host);
        } else {
          const b = h('button', { type: 'button', class: 'tn file', role: 'treeitem', style: { paddingLeft: (depth * 18 + 6) + 'px' }, html: (n.dirLike ? IC.folder : IC.file) + esc(n.f) });
          b.addEventListener('click', () => { sel = n; draw(); });
          host.append(b); fileEls.push([b, n]);
        }
      });
    }
    tree.append(h('div', { class: 'tn dir root', html: IC.folder + '.collab/　<small>仓库之外，不进 git</small>' }));
    build(TREE, 1, tree);
    const exp = U.explain();
    el.append(h('div', { class: 'ctrls' }, chips), h('div', { class: 'stage plain', style: { padding: '10px' } }, h('div', { class: 'split tsplit' }, tree, det)), exp);
    function draw() {
      cbs.forEach(b => { const on = b.dataset.k === who; b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on)); });
      tree.classList.toggle('filt', !!who);
      fileEls.forEach(([b, n]) => { b.classList.toggle('hit', !!who && n.w.includes(who)); b.classList.toggle('sel', n === sel); });
      if (sel) det.innerHTML = `<div class="tdh">${(sel.dirLike ? IC.folder : IC.file)}<b>${esc(sel.f)}</b></div><div class="tdr"><span>谁写</span><p>${esc(sel.by)}</p></div><div class="tdr"><span>写什么</span><p>${esc(sel.what)}</p></div>`;
      else det.innerHTML = '<p class="empty">点左边的文件，看规程对它的规定。</p>';
      if (who) {
        const fs = fileEls.filter(([b, n]) => n.w.includes(who)).map(([b, n]) => n.f);
        exp.innerHTML = `${window.who(who)} 会写 ${fs.length} 处：${fs.map(esc).join('、')}。` + (who === 'main' ? '主会话建单、写评审与批准行，也写两个唤醒脚本和交接单。' : who === 'duty' ? '值班会话写合并日志、调研单、调研索引，并在 sol 单与请求文件末尾写状态和合入记录。' : who === 'script' ? '唤醒脚本只写自己的记录目录。' : '');
      } else exp.innerHTML = '选一个写入方，或者点一个文件。';
    }
    draw();
  }
});

  brief: '一个包从派工到合入走九步，每步一个负责方。本页讲前半程：主会话或 Astra 派工，派子代理的一方建工作树，子代理施工后向派它的一方回报。',
  prereq: ['packages', 'collab'],
  html: `
<p class="lead">前面认识了参与者、分工、包（${pl('packages')}）和交接文件（${pl('collab')}），现在把它们串成流程。本页先看全景，再讲一个包从派工到交出候选的前半程；评审、批准、合并在下一页。</p>

<section id="s-flow"><h2><span class="h">全流程一览</span>${T('proj', '', '规程 §5.1 的九步流程')}</h2>
<p>${hl('一个包从派工到合入按固定顺序走，每一步只有一个负责方；只有主会话写了批准行的候选才合入')}。下图让一个包沿九步走一遍，可以切换 Opus 侧和 Astra 侧，也可以让它在评审或合并时被打回。</p>
${fig('pipeline')}
<p>对比两侧会发现，前四步的执行方不同（二号会话与它的子代理，或 Astra 与它的子代理），从第 5 步起汇合：审美与取值都由主会话评审，批准都由主会话写，合并与施工状态都由 Sol 值班会话执行。打回只有两种去处：评审不通过，回到原来的子代理接着改；合并冲突或门禁失败，值班会话撤回并报告。</p>
</section>

<section id="s-dispatch"><h2><span class="h">派工</span>${T('proj', '', '规程 §5.2')}</h2>
<p><b>从待派工队列派。</b>调研审计采纳或新决定带来的工作，先进 ENG-STATUS §4 的待派工队列（§5.8）；按 §4.2 开工的包照波次派。${hl('主会话按优先级与二号会话的并发余量，从"可派"条目里派工')}，派出后在条目里写任务单号。</p>
<p><b>Opus 侧的包</b>：主会话写任务单 max-&lt;nnn&gt;，一张单对应一个包或一件完整的事，再给二号会话发消息"新单 max-&lt;nnn&gt;"。单子里写五项：</p>
<ol><li>目标；</li><li>给子代理的完整简报：照 ENG-WP §4 的模板，写明工作树绝对路径、先读什么、主线版要做到哪；</li><li>用 Opus 还是 Sonnet，或写明"二号会话自己做"；</li><li>交付标准：截图、快检；</li><li>评审方式。</li></ol>
<p>每张单都附通用简报 max-brief-common。简报只给目标、约束和交付标准，不规定步骤（§3.4）。主会话派单要分批（§7.2）。</p>
<p><b>二号会话开子代理</b>：照单子里的模型开，把简报原样交给它，补上工作树的绝对路径（§8.4）；开之前按 §7.2 算一遍并发。</p>
<p><b>Astra 侧的包</b>：Astra 用 spawn_agent 开子代理，简报照 ENG-WP §4 的模板，并写明 §8.4 的"共用工作目录"注意事项；交给 gpt-6.1-sol 的包按 §3.3。</p>
<p><b>Sol 的任务</b>：交值班会话的活，主会话写任务单 sol-&lt;nnn&gt;，值班唤醒脚本发现新单就叫醒它读单执行；旁路活，主会话写旁路单 s&lt;nnn&gt; 放进 side/cards，旁路唤醒脚本按顺序交给 Sol 旁路会话（§6.5、§8.3）。</p>
<p><b>工作树</b>（ENG-ARCH §6）：${hl('谁派的子代理谁建')}。每个包一个工作树，目录名就是包号，分支 wp/&lt;xx&gt;-&lt;短名&gt;；D0 合入以后用仓库里建工作树的脚本建，D0 之前直接用 git 的 worktree 命令建。没有包号的任务用 SN-&lt;nnn&gt;，分支 sn/&lt;nnn&gt;-&lt;短名&gt;。</p>
</section>

<section id="s-build"><h2><span class="h">施工</span>${T('proj', '', '规程 §5.3，细则在 ENG-ONBOARD')}</h2>
<p>施工的细则在 ENG-ONBOARD，规程只列要点：</p>
${quote('§5.3', '<ul><li>只在自己的工作树里写，在自己的分支上小步提交，不推送、不合并；</li><li>主线闸口之前只交主线版（D-168）；</li><li>交候选之前跑快检 scripts\\gate.ps1 -Wp &lt;WP-xx&gt;，碰到启动、行走、存档时加跑对应的核心专项（ENG-GATES §2）；截图存到工作树的 output\\render-review\\；</li><li>结果看得见或听得见的，可调参数集中放一处（§5.4）；</li><li>要改契约或共享工程文件，提契约申请（§5.7）；</li><li>开始下一步之前看 merged.log，main 变了就 rebase（§5.6）。</li></ul>')}
<p>其中${hl('主线版')}是这个阶段的交付口径：能接进主线、跑得通、不崩、不挡路，细节留到主线闸口之后。</p>
</section>

<section id="s-report"><h2><span class="h">回报与初步核对</span>${T('proj', '', '规程 §5.3 的回报表')}</h2>
<p>回报按 ENG-GATES §5 的格式，${hl('交给派你的一方')}。对方接着做什么，取决于施工方是谁：</p>
<div class="tw"><table><thead><tr><th>施工方</th><th>回报给</th><th>对方接着做</th></tr></thead><tbody>
<tr><td>${who('secsub')}</td><td>二号会话</td><td>初步核对：快检是否通过、截图是否齐、候选提交是否在分支上，缺什么直接让子代理补；不做画面与风格的评审和定值。核对过了，在单子"状态"写一行"待评审：候选 &lt;提交&gt;，截图 &lt;路径&gt;，要定的问题 &lt;…&gt;"，给主会话发"max-&lt;nnn&gt; 待评审"</td></tr>
<tr><td>${who('astrasub')}</td><td>Astra 主线程</td><td>回答问题、审代码是否符合架构、跑快检，写合并请求 merge-&lt;WP-xx&gt;-&lt;序号&gt;；有可见或可听的结果，另写评审请求 review-&lt;WP-xx&gt;-&lt;序号&gt;</td></tr>
<tr><td>${who('mainsub')}</td><td>主会话</td><td>子代理写合并请求；主会话看结果和截图，在请求文件末尾写评审</td></tr>
<tr><td>${who('side', 'Sol 旁路会话的代码类旁路单')}</td><td>主会话</td><td>在单子指定的独立工作树里做，写合并请求（§8.3）</td></tr>
</tbody></table></div>
<p>注意二号会话的初步核对不碰审美：它只查快检、截图和候选提交，缺什么让子代理补，${hl('不做画面与风格的评审和定值')}。</p>
</section>

<section id="s-pos" class="pos"><h2><span class="h">在项目中的位置</span></h2>
<ul>
<li>派工的来源是待派工队列（${pl('research')}）；派单的数量受二号会话的并发公式和"挂着的单不超过 2 张"约束（${pl('quota2')}）。</li>
<li>回报之后进入评审、批准与合并（${pl('merge')}）。</li>
</ul>
</section>

<section id="s-sum" class="sum"><h2><span class="h">小结</span></h2>
<ul>
<li>九步：派工 → 建工作树 → 施工 → 回报与初步核对 → 评审 → 批准 → 合并执行 → 施工状态 → rebase 通知；每步一个负责方。</li>
<li>Opus 侧由主会话写任务单交二号会话，Astra 侧由 Astra 开子代理；谁派的子代理谁建工作树。</li>
<li>子代理向派它的一方回报；二号会话只做初步核对，不做审美评审。</li>
</ul>
</section>`,

    { id: 'wtwho', type: 'rule', name: '谁派的子代理谁建工作树', link: '谁派的子代理谁建', py: 'shuipaishuijian', block: 's-dispatch', anchor: '每个包一个工作树，目录名就是包号', body: '工作树由派子代理的一方建：每个包一个工作树，分支 wp/&lt;xx&gt;-&lt;短名&gt;；没有包号的任务用 SN-&lt;nnn&gt;，分支 sn/&lt;nnn&gt;-&lt;短名&gt;。' },

APP.demo('pipeline', {
  title: '一个包从派工到合入',
  goal: '每一步由谁做、留下什么产出？候选会在哪些地方被打回，打回以后去哪？',
  caption: '方框是九步，圆点是"这个包现在走到哪"。<b>虚线回箭头</b>是打回的路径，只在选了对应情形时出现。下方面板随步骤更新"谁做"和"产出"，圆点颜色沿用模型颜色。产出栏里的尖括号是占位。',
  init(el, ctx) {
    let side = 'o', branch = 'ok', idx = 0;
    const W = 760, H = 278, BW = 124, BH = 52;
    const pos = n => n <= 5 ? [70 + (n - 1) * 155, 64] : [690 - (n - 6) * 155, 206];

    U.arrowDefs(svg, 'pa', 'var(--ink3)'); U.arrowDefs(svg, 'pab', 'var(--bad)');
    const gE = S('g'), gB = S('g'), gN = S('g'); svg.append(gE, gB, gN);
    for (let n = 1; n < 9; n++) {

    const seqs = {

        b.classList.toggle('cur', k === n); b.classList.toggle('bad', k === n && /fail|conf/.test(v || ''));

      const [x, y] = pos(n); tok.style.opacity = 1; tok.style.transform = `translate(${x - BW / 2 + 12}px,${y - BH / 2 + 12}px)`;

APP.demo('mergeexec', {
  title: '值班会话的八步合并',
  goal: '合一个候选要过哪几关？哪一关失败时怎样收场？',
  caption: '左边是八步，<span class="okc">✓</span> 通过，<span class="badc">✗</span> 失败，灰色是没走到。右边是主检出与交接文件的状态。提交号、包号都是示例；"只改文档"指候选只改了文档。',
  init(el, ctx) {
    let sc = 'ok';
    const SC = {
      ok: { stop: 9, t: ['主检出没有任何未提交的改动，可以开始。', '把候选压成一个改动放进暂存区，没有冲突。', '跑默认门禁 G1–G5（批准行另写了组合就照写的跑）。全部通过。等 GPU 锁超过 15 分钟要查卡死的进程并报告，不绕过锁。', '提交：首行"WP-xx: 一句话"，正文要点只从请求文件或回报里取，结尾两行 Co-Authored-By。', '只推 main，不推分支，不强推。', '往合并日志追加一行，写明需要谁 rebase。', '该包工作树若干净，从新的 main 重建分支。不删分支和工作树。', '在请求文件或任务单末尾追加"已合入：main=…，时间，Sol 值班会话"，并通知主会话。'] },
      docs: { stop: 9, t: ['主检出干净。', '没有冲突。', '只改文档：跑 check_docs.py，要求 problems 0。', '提交：首行"文档：一句话"。', '只推 main。', '追加合并日志。', '文档类的临时工作树（SN-*、DOC-*）合入后保留。', '追加"已合入"行并通知主会话。'] },
      dirty: { stop: 1, fail: '主检出有未提交的改动。停下，写进文件末尾并通知主会话，不动别人的改动。' },
      conflict: { stop: 2, fail: '有冲突：撤回这次合并（git reset --merge），停下报告。之后由施工方 rebase 后重交。' },
      gate: { stop: 3, fail: '门禁失败：撤回，把失败项、关键报错行、日志路径写到文件末尾，通知主会话，停下。不修代码。' }
    };
    const segS = U.seg([{ v: 'ok', label: '正常合入' }, { v: 'docs', label: '只改文档' }, { v: 'dirty', label: '主检出不干净' }, { v: 'conflict', label: 'squash 冲突' }, { v: 'gate', label: '门禁失败' }], sc, v => { sc = v; stp.go(0); });
    const list = h('ol', { class: 'mxl' });
    const items = MX.map(t => { const li = h('li', { html: `<span class="mi"></span><span>${esc(t)}</span>` }); list.append(li); return li; });
    const panel = h('div', { class: 'mxp' });
    const exp = U.explain();
    const stp = U.stepper(ctx, { n: 10, ms: 1500, onStep: draw });
    el.append(h('div', { class: 'ctrls' }, segS), h('div', { class: 'ctrls' }, stp.el), h('div', { class: 'stage plain', style: { padding: '10px' } }, h('div', { class: 'split mxs' }, list, panel)), exp);
    function draw(i) {
      const S0 = SC[sc]; const stop = S0.stop; const last = Math.min(i, stop);
      items.forEach((li, k) => {
        const n = k + 1; const m = $('.mi', li);
        let st = 'todo';
        if (n <= last) st = S0.fail && n === stop ? 'bad' : 'ok';
        li.className = st + (n === last && i > 0 ? ' cur' : '');
        m.innerHTML = st === 'ok' ? IC.check : st === 'bad' ? IC.cross : String(n);
      });
      const failed = S0.fail && i >= stop;
      const done = !S0.fail && i >= 8;
      const mainV = done || (!S0.fail && i >= 4) ? 'main=5d0c9a1（新，示例）' : 'main=0f98a86（示例）';
      const pushed = !S0.fail && i >= 5;
      panel.innerHTML = `<div class="tdr"><span>主检出</span><p>${sc === 'dirty' && i >= 1 ? '<span class="badc">有别人的改动，不动它</span>' : i >= 2 && !failed ? '暂存区里是这次 squash 的改动' : failed ? '已撤回，恢复到合并前' : '干净'}</p></div>`
        + `<div class="tdr"><span>main</span><p>${mainV}${pushed ? '，已推送' : ''}</p></div>`
        + `<div class="tdr"><span>merged.log 末行</span><p>${!S0.fail && i >= 6 ? `…main=5d0c9a1 ${sc === 'docs' ? 'SN-xxx' : 'WP-xx'} 已合入：一句话。需要谁 rebase` : '（还没追加）'}</p></div>`
        + `<div class="tdr"><span>请求文件末尾</span><p>${failed ? '<span class="badc">失败情况与通知</span>' : done ? '已合入：main=5d0c9a1，时间，Sol 值班会话' : '批准合入：候选 …，Opus，时间'}</p></div>`;
      stp.setN(S0.fail ? stop + 1 : 9);
      if (i === 0) { exp.innerHTML = '初始状态：唤醒脚本发现了新的批准行，叫醒值班会话。它照 sol-001 的"合并执行"在主检出上开始。'; return; }
      if (failed) { exp.innerHTML = `<b>第 ${stop} 步 ${esc(MX[stop - 1])}</b>：<span class="st badc">✗</span> ${esc(S0.fail)}`; return; }
      exp.innerHTML = `<b>第 ${i} 步 ${esc(MX[i - 1])}</b>：${esc((S0.t || SC.ok.t)[i - 1])}` + (i === 8 ? '<br><span class="st okc">✓ 合入完成</span>　接下来是施工状态与 rebase 通知。' : '');
    }
    stp.go(0);
  }
});

const tween = (ctx, ms, fn, done) => {
  if (ctx.rm()) { fn(1); if (done) done(); return; }
  const t0 = performance.now();
  const step = now => { if (ctx.dead) return; const k = Math.min(1, (now - t0) / ms); fn(k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2); if (k < 1) requestAnimationFrame(step); else if (done) done(); };
  requestAnimationFrame(step);
};
