APP.demo('msgs', {
  title: '一件事走哪条通道',
  goal: '一个事件从谁发给谁、走跨会话消息还是流水文件？哪些事根本不发？',
  caption: '圆角框是参与者，连线是固定的通道：<b>实线</b>是跨会话消息，<b>虚线</b>是写进 notes 流水文件（主会话一侧有监视）。信封表示一条消息正在传。"Sol 值班与旁路会话"合成一个框，因为两者走同一个文件。',
  init(el, ctx) {
    const W = 760, H = 300;
    const svg = S('svg', { viewBox: `0 0 ${W} ${H}`, class: 'svgt msg', role: 'img', 'aria-label': '消息通道图' });
    const CH = [['main', 'second', 'solid'], ['main', 'astra', 'dash'], ['sol', 'main', 'dash'], ['secsub', 'second', 'solid'], ['main', 'author', 'solid']];
    const gC = S('g'); svg.append(gC);
    const chEls = CH.map(([a, b, k]) => { const p = S('path', { class: 'mc ' + k, d: `M${MP[a][0]},${MP[a][1]} L${MP[b][0]},${MP[b][1]}` }); gC.append(p); p.dataset.k = a + '-' + b; return p; });
    const lab = [['main', 'second', '跨会话消息'], ['main', 'astra', 'opus-to-astra / astra-to-opus'], ['sol', 'main', 'sol-to-opus'], ['secsub', 'second', '回报'], ['main', 'author', '只转问属于作者的决定']];
    lab.forEach(([a, b, t]) => svg.append(S('text', { class: 'mcl', x: (MP[a][0] + MP[b][0]) / 2 + (a === 'secsub' ? 10 : 0), y: (MP[a][1] + MP[b][1]) / 2 - 6, 'text-anchor': a === 'secsub' ? 'start' : 'middle', text: t })));
    const nodes = {};
    Object.entries(MP).forEach(([k, [x, y]]) => {
      const w = k === 'sol' ? 170 : k === 'secsub' ? 150 : 120;
      const g = S('g', { class: 'mn', transform: `translate(${x - w / 2},${y - 18})` });
      g.append(S('rect', { width: w, height: 36, rx: 9 }), S('rect', { width: 6, height: 36, rx: 3, fill: APP.WHO[MW[k]].c }), S('text', { x: w / 2 + 3, y: 23, 'text-anchor': 'middle', text: MN[k] }));
      svg.append(g); nodes[k] = g;
    });
    const env = S('g', { class: 'env big' }); env.append(S('rect', { x: -12, y: -8, width: 24, height: 16, rx: 3 }), S('path', { d: 'M-12,-8 L0,2 L12,-8' }));
    const no = S('g', { class: 'nosend' }); no.append(S('circle', { r: 16 }), S('path', { d: 'M-11,11 L11,-11' }));
    env.style.opacity = 0; no.style.opacity = 0; svg.append(env, no);
    const list = h('div', { class: 'evlist' });
    const exp = U.explain();
    let run = 0;
    const bs = EV.map((e, i) => { const b = h('button', { type: 'button', class: 'pick' + (e.no ? ' no' : ''), html: (e.no ? IC.cross : IC.arrow) + esc(e.s) }); b.addEventListener('click', () => play(i)); list.append(b); return b; });
    el.append(list, h('div', { class: 'stage' }, svg), exp);
    function play(i) {
      const e = EV[i]; const my = ++run;
      bs.forEach((b, k) => b.classList.toggle('on', k === i));
      chEls.forEach(p => p.classList.remove('on'));
      Object.values(nodes).forEach(n => n.classList.remove('on'));
      exp.innerHTML = `<b>${esc(e.s)}</b>：` + (e.no ? `<span class="st badc">✗ 不发</span>　${e.say}。` : `${e.hops.map(hp => MN[hp[0]] + ' → ' + MN[hp[1]]).filter((v, k, a) => a.indexOf(v) === k).join('，')}。通道：${e.ch}。内容：${e.say}。`) + (e.confirm ? '<br>子代理不直接问作者，也不直接找主会话；二号会话把问题写进单子并转达。主会话能据项目信息判断的直接定，只有属于作者的决定才走最后一段。' : '') + (e.merged ? '<br>三张单各发一条会打断主会话三次；合成一条，细节都在各自单子的"状态"里。' : '');
      env.style.opacity = 0; no.style.opacity = 0;
      if (e.no) { const [x, y] = MP.main; no.setAttribute('transform', `translate(${x + 80},${y - 40})`); no.style.opacity = 1; return; }
      let k = 0;
      const hop = () => {
        if (my !== run || k >= e.hops.length) { return; }
        const [a, b] = e.hops[k];
        const p = chEls.find(c => c.dataset.k === a + '-' + b || c.dataset.k === b + '-' + a); if (p) p.classList.add('on');
        nodes[a].classList.add('on'); nodes[b].classList.add('on');
        const [x1, y1] = MP[a], [x2, y2] = MP[b];
        env.style.opacity = 1;
        tween(ctx, 700, t => env.setAttribute('transform', `translate(${x1 + (x2 - x1) * t},${y1 + (y2 - y1) * t})`), () => { k++; if (k < e.hops.length) ctx.after(250, hop); });
      };
      hop();
    }
    exp.innerHTML = '点上面的一个事件。';
  }
});

APP.demo('wake', {
  title: '两个唤醒脚本的一段模拟',
  goal: '同时来了批准行和新的 sol 单，值班会话先被叫醒做哪件？旁路单为什么一张一张交？',
  caption: '时间是模拟的：每次"检查"相当于脚本的一次 20 秒轮询。<b>每轮耗时是示意</b>（值班：合并 5 分钟、读单执行 4 分钟、巡检 2 分钟；旁路：旁路单 10 分钟、调研单 20 分钟）。假设会话这一轮没结束时，脚本不会再叫醒它。日志行仿照记录目录里的唤醒记录，内容是示意。',
  init(el, ctx) {
    let S0;
    const fmt = s => { const m = Math.floor(s / 60), x = s % 60; return `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}:${String(x).padStart(2, '0')}`; };
    function reset() {
      S0 = { t: 0, appr: [], sol: [], side: ['s005.md'], seenA: new Set(), seenS: new Set(), done: new Set(), duty: { until: -1, task: '', last: 0 }, sd: { until: -1, task: '' }, logD: [], logS: [], nA: 0, nSol: 3, nS: 6, nR: 9 };
      draw();
    }
    const bA = h('button', { class: 'btn', type: 'button', html: IC.tRule + '写一条批准行' });
    const bT = h('button', { class: 'btn', type: 'button', html: IC.file + '新建 sol 任务单' });
    const bS = h('button', { class: 'btn', type: 'button', html: IC.file + '放一张旁路单' });
    const bR = h('button', { class: 'btn', type: 'button', html: IC.file + '放一张调研单' });
    const bTick = h('button', { class: 'btn pri', type: 'button', html: IC.next + '检查一次（+20 秒）' });
    const bFF = h('button', { class: 'btn', type: 'button', html: IC.play + '快进 5 分钟' });
    const bRs = h('button', { class: 'btn', type: 'button', html: IC.reset + '重置' });
    bA.addEventListener('click', () => { S0.nA++; S0.appr.push({ id: S0.nA, t: S0.t }); note(`写入一条批准行（示例 #${S0.nA}）`); draw(); });
    bT.addEventListener('click', () => { const n = `sol-${String(S0.nSol++).padStart(3, '0')}.md`; S0.sol.push(n); note(`新建任务单 ${n}`); draw(); });
    bS.addEventListener('click', () => { const n = `s${String(S0.nS++).padStart(3, '0')}.md`; S0.side.push(n); note(`side/cards 放入旁路单 ${n}`); draw(); });
    bR.addEventListener('click', () => { const n = `r${String(S0.nR++).padStart(3, '0')}.md`; S0.side.push(n); note(`side/cards 放入调研单 ${n}`); draw(); });
    bTick.addEventListener('click', () => { tick(); draw(); });
    bFF.addEventListener('click', () => { for (let k = 0; k < 15; k++) tick(); draw(); });
    bRs.addEventListener('click', reset);
    const clock = h('div', { class: 'wclock' });
    const colD = h('div', { class: 'wcol' }), colS = h('div', { class: 'wcol' });
    const exp = U.explain();
    el.append(h('div', { class: 'ctrls' }, bA, bT, bS, bR), h('div', { class: 'ctrls' }, bTick, bFF, bRs), clock, h('div', { class: 'stage plain', style: { padding: '10px' } }, h('div', { class: 'two', style: { margin: 0 } }, colD, colS)), exp);
    let lastMsg = '';
    function note(m) { lastMsg = m; }
    function wakeD(task, dur) { S0.duty.until = S0.t + dur; S0.duty.task = task; S0.duty.last = S0.t; S0.logD.unshift([S0.t, '叫醒值班会话：' + task]); lastMsg = `第 ${fmt(S0.t)} 次检查：叫醒值班会话——${task}。`; }
    function tick() {
      S0.t += 20; lastMsg = `${fmt(S0.t)} 的检查：没有要叫醒的事。`;
      if (S0.duty.until >= 0 && S0.t >= S0.duty.until) { S0.duty.until = -1; S0.logD.unshift([S0.t, '本轮结束']); }
      if (S0.sd.until >= 0 && S0.t >= S0.sd.until) { S0.sd.until = -1; S0.logS.unshift([S0.t, S0.sd.task + ' 本单结束']); S0.sd.task = ''; }
      if (S0.duty.until < 0) {
        const nA = S0.appr.filter(a => !S0.seenA.has(a.id));
        const nS = S0.sol.filter(c => !S0.seenS.has(c));
        if (nA.length) { nA.forEach(a => S0.seenA.add(a.id)); wakeD(`新的批准行 ${nA.length} 条，照 sol-001 合并并巡检`, 300); }
        else if (nS.length) { nS.forEach(c => S0.seenS.add(c)); wakeD(`新任务单 ${nS.join('、')}，读单执行`, 240); }
        else if (S0.t - S0.duty.last >= 1800) wakeD('距上次唤醒满 30 分钟，定时巡检，不合并任何东西', 120);
      }
      if (S0.sd.until < 0) {
        const next = S0.side.filter(n => !S0.done.has(n)).sort()[0];
        if (next) { S0.done.add(next); S0.sd.task = next; S0.sd.until = S0.t + (next[0] === 'r' ? 1200 : 600); S0.logS.unshift([S0.t, `交出 ${next}，叫醒旁路会话，照 ROLE.md 执行`]); lastMsg += `　旁路脚本交出 ${next}。`; }
      }
    }
    function draw() {
      clock.innerHTML = `${IC.reset.replace('class="ico"', 'class="ico" style="width:16px;height:16px"')}<b>模拟时间 ${fmt(S0.t)}</b>　两个脚本都每 20 秒查一次`;
      const d = S0.duty, sd = S0.sd;
      const pendA = S0.appr.filter(a => !S0.seenA.has(a.id)).length, pendS = S0.sol.filter(c => !S0.seenS.has(c));
      const since = S0.t - d.last;
      colD.innerHTML = `<h5>${IC.term}值班唤醒脚本 → ${who('duty')}</h5>
        <div class="wst ${d.until >= 0 ? 'busy' : ''}">${d.until >= 0 ? `这一轮：${esc(d.task)}<small>还剩 ${Math.ceil((d.until - S0.t) / 60)} 分钟</small>` : '空闲'}</div>
        <div class="wq"><span>待处理的批准行</span><b>${pendA}</b></div><div class="wq"><span>待处理的 sol 单</span><b>${pendS.length ? pendS.join('、') : '0'}</b></div>
        <div class="wq"><span>距上次唤醒</span><b>${Math.floor(since / 60)} 分 ${since % 60} 秒</b></div><div class="wbar"><i style="width:${Math.min(100, since / 1800 * 100)}%"></i><em>满 30 分钟巡检</em></div>
        <div class="wlog">${S0.logD.slice(0, 6).map(l => `<div><span>${fmt(l[0])}</span>${esc(l[1])}</div>`).join('') || '<div class="empty">还没有唤醒记录</div>'}</div>`;
      const queue = S0.side.filter(n => !S0.done.has(n)).sort();
      colS.innerHTML = `<h5>${IC.term}旁路唤醒脚本 → ${who('side')}</h5>
        <div class="wst ${sd.until >= 0 ? 'busy' : ''}">${sd.until >= 0 ? `这一张：${esc(sd.task)}<small>还剩 ${Math.ceil((sd.until - S0.t) / 60)} 分钟</small>` : '空闲'}</div>
        <div class="wq"><span>side/cards 里还没交出的</span><b>${queue.length ? queue.join('、') : '0'}</b></div>
        <div class="wq"><span>已交出</span><b>${[...S0.done].join('、') || '—'}</b></div>
        <div class="wlog">${S0.logS.slice(0, 7).map(l => `<div><span>${fmt(l[0])}</span>${esc(l[1])}</div>`).join('') || '<div class="empty">还没有唤醒记录</div>'}</div>`;
      exp.innerHTML = lastMsg || '初始状态：side/cards 里已经放着一张旁路单 s005。试试先"写一条批准行"再"新建 sol 任务单"，然后逐次检查。';
    }
    reset();
  }
});

<section id="s-sched"><h2><span class="h">调研的排程</span>${T('proj', '', '规程 §8.2（任务单 sol-002）')}</h2>
<p>完成度调研是流水线的第 1 步，而且${hl('调研是持续的，不是一轮就结束')}：值班会话按开发阶段排调研，阶段不变时也持续找新方向，由 Sol 旁路会话执行。</p>
<ul>
<li><b>阶段调研</b>：值班会话按 ENG-STATUS §2 的"当前阶段"排调研。阶段一变，或主会话在 sol-002 的"状态"里要求新一轮，就写一张调研单 side/cards/r&lt;nnn&gt;.md。</li>
<li><b>持续调研</b>：每次巡检时，下面两条同时满足，就再写一张新方向的调研单：距上一张调研单启动超过 2 小时；旁路会话当前空闲（旁路唤醒脚本日志 runner.log 的最后一行是"本单结束"）。</li>
</ul>
${fig('rtrigger')}
<ul>
<li><b>新方向</b>：每张 4–6 个方向，不重复已做过的，每个方向写明为什么现在值得查。新方向从这些地方找：前几轮总览里"未核实""需要 Opus 拍板""建议后续调研"的条目；merged.log 里新合入的包带来的新问题；当前阶段的侧重；同类作品与主流二次元游戏的新版本、新系统；Godot 4.x 与三渲二相关的新技术与工程做法；玩家社区对同类作品的新反馈。</li>
<li><b>调研索引</b> research/INDEX.md：一单一行，写单号、启动时间、阶段、方向、总览路径、Opus 审计状态。值班会话写新单前先读它去重，新单写完追加一行；旁路会话做完标"待审"；主会话审计后改最后一列。</li>
<li><b>模板</b>：调研单以 research/cards/r002.md 为模板，写进 side/cards，按当前阶段调整背景、调研方向和输出目录 research/&lt;日期&gt;-r&lt;nnn&gt;/。</li>
<li><b>边界</b>：值班会话和旁路会话只负责让调研持续产出，不改工作包、不派工。</li>
</ul>
</section>

<section id="s-run"><h2><span class="h">调研的执行</span>${T('proj', '', '规程 §8.2')}</h2>
<ul><li>旁路唤醒脚本发现新的调研单，按顺序交给 Sol 旁路会话（§6.5）。</li><li>旁路会话按方向开 gpt-6.1-sol 子代理并行调研，对照同类作品和主流二次元游戏，各写一份报告。</li><li>00-总览 写按优先级去重的建议表，每条标明归哪个包或建议新包、主线版还是细节阶段、工作量、依赖。</li><li>写完把 INDEX 里这一单标成"待审"，在 notes/sol-to-opus.md 追加一行"[时间] 调研 r&lt;nnn&gt; 完成：&lt;总览路径&gt;"。调研单启动${hl('超过 3 小时')}仍没有完成行，值班会话查 runner.log 与这张单的 stderr.log，写进"状态"并通知主会话。</li></ul>
</section>

<section id="s-scope"><h2><span class="h">调研的视角与边界</span>${T('proj', '', '规程 §8.2')}</h2>
<p><b>三个视角</b>（每张调研单都要覆盖）：</p>
<div class="cards">
<div class="card"><h4>制作完整度</h4>内容量与密度、各系统与管线的覆盖、质量保障与测试、性能与稳定性、存档稳健、发布与本地化、无障碍、玩家对同类作品的预期</div>
<div class="card"><h4>优越性</h4>和同类作品比的长处与短处、差异化卖点、让人记住的时刻与展示画面、技术与美术上值得放大的地方、同类作品常被批评而本项目可以避开的地方</div>
<div class="card"><h4>玩家体验</h4>首次体验与上手、一次游玩的节奏与情绪曲线、舒适度（晕动、眼睛疲劳）与可达性、操作与界面的摩擦、加载与等待、反馈与手感、回访与重玩的理由</div>
</div>
<p><b>各阶段的侧重</b>：第一波、第二波：看世界与观光模式缺什么；主线闸口与集中测试：看质量缺口、性能与设置、发布完整度；细节阶段：看细节打磨与交互小物。</p>
<p><b>不调研的</b>：</p>
${quote('§8.2', '<ul><li>任何阶段都不调研、不建议 RPG 内容；</li><li>本项目是个人实验性作品（D-181），不调研商店页、上架、宣传素材、成就、云存档、平台集成等商业发行内容；"发布完整度"只看按 OPS-RELEASE 在 GitHub 发整包时的完整与稳健；</li><li>GPT 只收集观感方面的事实与做法，不下画面结论。</li></ul>')}
</section>

<section id="s-pos" class="pos"><h2><span class="h">在项目中的位置</span></h2>

<li>第 1 步的执行靠旁路唤醒脚本与 Sol 旁路会话（${pl('messages')}、${pl('sol')}）。</li>

</section>

<section id="s-duty"><h2><span class="h">Sol 值班会话</span>${T('proj', '', '规程 §8.1')}</h2>
<p>${hl('值班会话是一个固定的 gpt-6.1-sol 会话（快速模式），承担总指挥的执行类杂活')}，由唤醒脚本叫醒，每轮只处理被叫醒的事和巡检。它的长期任务单是 sol-001，thread 01a14132-0184-7ce1-89b8-b3e472a5af73。</p>

${fig('patrol')}
<p>它有一张明确的不许做清单：</p>
${quote('§8.1 不许做', '<p>改代码；改契约与共享工程文件；改 ENG-STATUS 以外的设计文档（任务单给出确切文字时除外）；合并没有批准行的候选；强推；删除分支或工作树；做任何画面与风格判断。</p>')}
</section>

<section id="s-side"><h2><span class="h">Sol 旁路会话</span>${T('proj', '', '规程 §8.3')}</h2>
<p>旁路会话也是一个固定的 gpt-6.1-sol 会话，但用普通速度，不开快速模式；thread 01a14176-abbf-7862-98ba-137e2ad1686f，角色说明 side/ROLE.md。完成度调研和其他旁路任务都由它一个会话管理，${hl('按任务单开子代理并行处理')}。</p>
<p><b>两类任务单</b>（都放在 side/cards）：调研单 r&lt;nnn&gt;，由值班会话写，做法见 ${pl('research')}；旁路单 s&lt;nnn&gt;，由主会话写。主会话判断某件事${hl('不在主线关键路径上、却会占主线时间')}，或者要大量补信息、调研、批量核对数据时，就写一张旁路单，写明在哪做、交付什么、能改什么、哪些不许做。派不派、派几张、做到什么程度，由主会话定。</p>
<p><b>怎么执行</b>：旁路唤醒脚本按文件名顺序一次交一张单，旁路会话做完这一张就结束本轮；按单子的方向数用 spawn_agent 开 gpt-6.1-sol 子代理，最多 8 个并发，子代理的简报写明"共用工作目录"注意事项；旁路单做完，在单子末尾"状态"写结果，在 sol-to-opus 追加一行；上下文重置后，照 side/cards 下各单的"状态"接着做。</p>
${quote('§8.3 边界', '<ul><li>不做任何审美工作（§2.2）；调研里涉及观感的，只收集事实和出处。</li><li>不改契约和共享工程文件；不改 docs/design/，任务单给出确切文字的补丁除外；不合并，不推送。</li><li>不碰任何包的工作树和主检出。要写代码的旁路活，在单子指定的独立工作树里做，完成后写合并请求，经主会话批准由值班会话合入（§5.5）。</li><li>调研报告和旁路产出写进单子指定的位置；主会话读了以后决定怎么改文档、派给谁。</li></ul>')}
</section>

<section id="s-spawn"><h2><span class="h">各方怎么开子代理</span>${T('proj', '', '规程 §8.4')}</h2>
<p><b>各方都适用</b>：${hl('一个包或子包一个子代理；同一时刻，一个文件只有一个代理在写')}。每个子代理各用一个工作树（§5.2）。简报按 ENG-WP §4 的模板写。dotnet build、--import 和烘焙这类重 CPU 任务，走计数锁（ENG-ARCH §6）。Claude 侧的子代理由仓库根的 CLAUDE.md 自动载入开工手册；Codex 侧的不会，简报里要写明先读 ENG-ONBOARD。</p>
<p><b>Claude 侧</b>（只在二号会话；主账号不开新的子代理）：用 Agent 工具在后台开，指定模型 opus 或 sonnet；一个包一个，简报里写明工作树的绝对路径；评审不通过，把意见发回同一个子代理，在原上下文里继续改。</p>
<p><b>Codex 侧</b>（Astra 与 Sol 旁路会话）：用 Codex 的协作工具——spawn_agent 开（task_name 写包号，message 写完整简报）、wait_agent 等、list_agents 查、send_input 追加指示；并发上限是每个会话 36 个（当前配置），Sol 旁路会话另按 ROLE.md 最多 8 个。</p>
<p>Codex 侧有一个特别的坑：${hl('子代理和主线程共用同一个工作目录')}。所以简报里必须写明四条：你的工作树在哪；所有读写都用这个工作树下的绝对路径，git 一律指定工作树；不碰别的工作树，也不碰主检出；不合并、不推送。</p>
${fig('cwd')}
<p><b>Astra 主线程负责</b>：派工；回答子代理的问题；审代码是否符合架构；跑快检；写合并请求；处理契约申请；看 merged.log，通知自己的子代理 rebase。</p>
</section>

APP.demo('patrol', {
  title: '一次巡检',
  goal: '值班会话每次被叫醒都要巡检哪几项？每一项碰到什么情况，该做什么、不该做什么？',

    const rP = U.range({ label: '一个门禁进程已运行', min: 0, max: 40, step: 1, value: st.minutes, fmt: v => v + ' 分钟', on: v => { st.minutes = v; draw(); } });

    const rR = U.range({ label: '距上一张调研单启动', min: 0, max: 5, step: .5, value: st.since, fmt: v => v + ' 小时', on: v => { st.since = v; draw(); } });
    const inputs = h('div', { class: 'list' }, rP, tg('带条件的批准行：条件已满足（示例：merge-WP-00-4 已合入 main）', 'cond'), tg('有个工作树落后：main 不是它 HEAD 的祖先', 'behind'), rR, tg('旁路会话空闲', 'idle'));
    const out = h('div', { class: 'list patrol' });
    const sum = h('div', { class: 'note' });
    const nos = h('div', { class: 'nos' });
    el.append(h('div', { class: 'two', style: { margin: 0 } }, h('div', { class: 'cbox' }, h('h5', { html: IC.reset + '这一次被叫醒时' }), inputs), h('div', { class: 'cbox' }, h('h5', { html: IC.tProc + '这一轮该做的' }), out)), sum, nos);
    const NO = ['改代码', '改契约与共享工程文件', '改 ENG-STATUS 以外的设计文档', '合并没有批准行的候选', '强推', '删除分支或工作树', '做画面与风格判断', '自己杀掉卡死的进程'];
    nos.innerHTML = '<b>不许做：</b>' + NO.map(n => `<span class="no">${IC.cross}${esc(n)}</span>`).join('') + '<small>（最后一项见巡检原文："通知主会话，不自己杀"）</small>';
    function row(ok, title, text) { return h('div', { class: 'prow ' + ok, html: `<b>${esc(title)}</b>${text}` }); }
    function draw() {
      out.innerHTML = ''; const lines = [];
      if (st.minutes > 15) { out.append(row('act', '卡死进程', `运行 ${st.minutes} 分钟，超过 15 分钟：记下 PID、命令行、所属工作树，<b>通知主会话</b>，不自己杀。`)); lines.push('卡死进程已报告'); }
      else out.append(row('ok', '卡死进程', `运行 ${st.minutes} 分钟，没超过 15 分钟，不用管。`));
      if (st.cond) { out.append(row('act', '带条件的批准行', '条件满足了：照 §5.5 合入。')); lines.push('条件批准行已合入'); }
      else out.append(row('ok', '带条件的批准行', '条件还没满足：不合，下次巡检再查。'));
      if (st.behind) { out.append(row('act', '工作树落后', '列一行写进"状态"，<b>不用通知</b>。')); lines.push('落后的工作树已列出'); }
      else out.append(row('ok', '工作树落后', '没有落后的工作树。'));
      if (st.since > 2 && st.idle) { out.append(row('act', '完成度调研', '距上一张超过 2 小时且旁路会话空闲：写一张新方向的调研单（§8.2）。')); lines.push('写了新调研单'); }
      else out.append(row('ok', '完成度调研', '这次不写新调研单' + (st.since <= 2 ? '：距上一张还没超过 2 小时' : '：旁路会话不空闲') + '。'));
      sum.innerHTML = `<b>写进 sol-001 末尾"状态"</b>（一行一事，带时间）：${lines.length ? lines.map(esc).join('；') : '巡检无事'}。` + (st.minutes > 15 ? '　通知写进 sol-to-opus。' : '');
    }
    draw();
  }
});

<section id="s-loop"><h2><span class="h">规程的运转循环</span>${T('proj', '', '把全规程串成一个循环，是对本项目规程的归纳（补充解释）')}</h2>

<section id="s-ten"><h2><span class="h">十条结论</span>${T('proj', '', '规程 §0 的结论原文')}</h2>
<p>规程 §0 用十条话概括全文，下面是原文；每条后面是展开它的页面。</p>
<ol class="ten">
<li><b>参与者</b>（§1，D-179）：作者提出要求、最终拍板。协作的会话分属三个账号：主账号的 Opus <b>主会话</b>是总指挥；<b>二号会话</b>（第二个 Claude 账号，Max 20x）开 Opus 与 Sonnet 子代理，承担 Opus 侧的施工；<b>Astra</b>（GPT-6 Astra，xhigh，本机 Codex）是工程负责人，开自己的子代理；<b>Sol 会话</b>（gpt-6.1-sol）有两个固定会话：值班会话（快速模式）做执行类的活，旁路会话（普通速度）按任务单开子代理，做完成度调研与旁路活。<span class="go">→ ${pl('actors')}</span></li>
<li><b>主代理只有一个，就是主会话</b>（§1.1，ENG-ARCH §6，D-166）：合并队列、main 的提交与推送、ENG-STATUS、docs/design/ 的修改、与作者沟通，都由它决定。不需要判断的执行部分交 Sol 值班会话；main 同一时刻只有一个执行人。<span class="go">→ ${pl('actors')}</span></li>
<li><b>按模型能力分工，视觉风格只由 Opus 侧做</b>（§2）：Opus 管审美、判断与变通；Sonnet 做语言与看图；Astra 管架构与复杂工程；gpt-6.1-sol 做便宜、快、可高并发的活。GPT 模型不做任何审美工作；玩家看得见、听得见的结果，参数和取舍都由主会话评审定值。<span class="go">→ ${pl('ability')}</span></li>
<li><b>契约以 Astra 为准</b>（§5.7）：契约与共享工程文件只由 Astra 改。牵涉画面表现的契约由 Astra 起草，主会话确认后再冻结（§5.4，D-134）。<span class="go">→ ${pl('after')}</span></li>
<li><b>按难度选模型，总指挥只做判断</b>（§3）：主会话只做评审定值、设计定案、派工与合入决定、与作者沟通；主账号不开新的子代理，所有并发的 Opus 子代理都在二号会话的账号上跑；不需要审美的活默认先派 Sol。包内的实现路径由施工模型自己规划。<span class="go">→ ${pl('tiering')}</span></li>
<li><b>包按擅长归属，主线分段开工，每个包按固定顺序合入</b>（§4、§5.1–§5.7）：D0 → 第一波 → 第二波 → 主线闸口；一个包走派工 → 建工作树 → 施工 → 回报 → 评审 → 批准行 → 合并执行 → 施工状态 → rebase 通知。只合有主会话批准行的候选，合并由 Sol 值班会话执行。<span class="go">→ ${pl('packages')}、${pl('dispatch')}</span></li>

<li><b>经文件交接，消息只在事件发生时发</b>（§6）：交接目录是 E:\\Project\\UESTC_RPG.wt\\.collab\\。任务单和请求文件是交接的唯一依据，任何一方上下文重置，都照它们接着做。两个 Sol 会话各由一个唤醒脚本叫醒：值班会话按批准行、新任务单和定时；旁路会话按 side/cards/ 下的新任务单，一次一张。下属会话与子代理不向作者出选项或确认框：要确认的事写进任务单或请求文件并通知主会话，主会话能据项目信息判断的直接定，只有属于作者的决定才转问作者（§6.4）。<span class="go">→ ${pl('collab')}、${pl('messages')}</span></li>

<li><b>值班、调研和旁路交给 Sol</b>（§8）：值班会话长期做合并执行、施工状态与巡检，并按开发阶段持续排完成度调研；调研单和不在关键路径上的旁路活都写成任务单，交固定的 Sol 旁路会话按单开子代理处理；调研结果走调研入队流水线（§5.8）。Sol 不做审美，不改契约和共享工程文件；设计文档只在两种情况下改：值班会话维护 ENG-STATUS，任务单给出确切文字时按文打补丁。<span class="go">→ ${pl('sol')}</span></li>

<section id="s-tell"><h2><span class="h">向别人讲清这份规程</span>${T('proj', '', '对规程的归纳讲法（补充解释），不是规程原文')}</h2>
<p>如果只有一分钟，可以这样讲（这是归纳，规则以原文为准）：</p>
<ol>
<li>一个作者拍板，一个主会话总指挥。主会话只做判断：评审定值、派工、批准合入、与作者沟通。</li>
<li>活按模型能力和难度分：审美全归 Opus 侧，GPT 一律不碰；架构与契约归 Astra；便宜的杂活先派 gpt-6.1-sol。</li>
<li>一个包走九步，只有主会话写了批准行的候选才合入；合并由 Sol 值班会话执行，一次一个。</li>
<li>一切经 .collab 里的文件交接，消息只是提醒；Sol 会话由唤醒脚本按批准行、任务单和定时叫醒。</li>
<li>新工作经"调研 → 审计 → 并包 → 入队"进入队列；额度按公式控制并发，主账号见底时由二号会话接任。</li>
</ol>
</section>

<section id="s-pos" class="pos"><h2><span class="h">在项目中的位置</span></h2>
<p>本页是图谱的顶层。规程本身是 docs/design/engineering 下的 ENG-TEAM，主责 WP-00，依赖 ENG-WP、ENG-ARCH、ENG-ONBOARD。它明确不管的内容：</p>
<ul>
<li>包的划分、独占目录与交付：ENG-WP；</li>
<li>git 工作树与合并的命令细节：ENG-ARCH §6；</li>
<li>子代理的工作规则：ENG-ONBOARD；</li>
<li>测试与回报格式：ENG-GATES；</li>
<li>此刻的施工进度：ENG-STATUS。</li>
</ul>
</section>

<section id="s-sum" class="sum"><h2><span class="h">小结</span></h2>
<ul>
<li>规程是一个循环：调研入队 → 派工 → 施工 → 评审 → 批准 → 合并 → 施工状态与可派 → 再派工；唤醒脚本、交接目录、额度与移交让它自己转、转得稳。</li>
<li>十条结论覆盖参与者、主代理、按能力与难度分工、契约、包与流程、调研入队、文件交接、额度、值班与旁路。</li>
<li>按身份读 §0.1；第一波的并发规模和交接时延还是待验证的初值。</li>
</ul>

APP.demo('loop', {
  title: '规程的运转循环',
  goal: '规程的各部分怎样连成一个持续运转的循环？每一站由谁推动？',

  init(el, ctx) {
    const W = 760, H = 470, cx = 380, cy = 232, R = 176;

    const sts = LOOP.map((L, k) => {
      const a = ang(k), x = cx + R * Math.cos(a), y = cy + R * Math.sin(a);

      g.append(S('text', { x: lx, y: ly, 'text-anchor': Math.abs(Math.cos(a)) < .3 ? 'middle' : Math.cos(a) > 0 ? 'start' : 'end', class: 'lt', text: L.n }));
      const go = () => { location.hash = '#/p/' + L.p; };
      g.addEventListener('click', go); g.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
      g.addEventListener('mouseenter', () => show(k)); g.addEventListener('focus', () => show(k));
      svg.append(g); return g;
    });
    const SUP = [['唤醒脚本', 'messages', -1, -1], ['交接目录', 'collab', 1, -1], ['额度与并发', 'quota2', -1, 1], ['主会话移交', 'handover', 1, 1]];
    SUP.forEach(([t, p, dx, dy]) => {
      const g = S('g', { class: 'lsup', tabindex: 0, role: 'link', 'aria-label': t, transform: `translate(${cx + dx * 62 - 55},${cy + dy * 36 - 15})` });

    });
    const tok = S('circle', { r: 7, class: 'ltok mv' }); svg.append(tok);
    const exp = U.explain();
    let cur = 0;
    const stp = U.stepper(ctx, { n: LOOP.length + 1, ms: 1700, label: i => i === 0 ? '初始状态' : `第 ${i} 站 / 共 ${LOOP.length} 站`, onStep: i => { cur = i; if (i === 0) { tok.style.opacity = 0; sts.forEach(s => s.classList.remove('on')); exp.innerHTML = '初始状态：按"播放"让一件工作沿循环走一圈；也可以把指针移到任意一站。'; return; } show(i - 1); } });

    }
    el.append(h('div', { class: 'ctrls' }, stp.el), h('div', { class: 'stage scrollx' }, svg), exp);
    stp.go(0);
  }
});
