<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>作者观察台</title>
<link rel="stylesheet" href="app/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <span class="brand-name">作者观察台</span>
    <span class="brand-sub">电光年华</span>
  </div>
  <div class="leads" id="leads" aria-label="两位指挥"></div>
  <button class="fresh" id="fresh" type="button" title="各份数据新不新，点了看健康页的新鲜度">
    <span class="dot"></span><span class="fresh-text" id="fresh-text">等数据</span>
  </button>
</header>
<div class="shell">
  <nav class="nav" id="nav" aria-label="页面"></nav>
  <main class="main" id="main"></main>
</div>
<div class="corner" id="corner" role="status" hidden></div>
<script src="vendor/echarts.min.js"></script>
<script src="vendor/marked.min.js"></script>
<script src="api/data-names.js"></script>
<script src="app/manifest.js"></script>
<script src="app/core.js"></script>
<script src="app/ui.js"></script>
<script src="app/palette.js"></script>
<script src="app/charts.js"></script>
<script src="app/reader.js"></script>
</body>
</html>
