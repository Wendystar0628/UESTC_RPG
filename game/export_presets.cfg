; Main PCK contains global resources and authored JSON only.
; boot_<map>.pck is a separate release artifact produced by WP-02, not a nested main-PCK resource.
[preset.0]
name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="style/palette/*.json,style/palette/**/*.json,hud/**/*.json,data/*.json,data/**/*.json,data/build-commit.txt,data/maps/**/*.json,data/weather/**,data/audio/**,contracts/schemas/*.json,contracts/schemas/**/*.json"
exclude_filter="gdunit4_testadapter_v*/*,gdunit4_testadapter_v*/**,override.cfg,**/override.cfg,addons/gdUnit4/*,addons/gdUnit4/**,tests/*,tests/**,**/tests/*,**/tests/**,gates/*.json,gates/**/*.json,gates/data/*,gates/data/**,gatesdata/*,gatesdata/**,**/gatesdata/*,**/gatesdata/**,gates/fixtures/*,gates/fixtures/**,data/maps/gates-*/**,bake/*,bake/**,**/*.pck,output/*,output/**,**/bin/*,**/bin/**,**/obj/*,**/obj/**"
export_path="../output/export/windows/UESTC.exe"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]
custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=false
binary_format/architecture="x86_64"
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
application/modify_resources=true
application/icon="res://assets/hud/app_icon_placeholder.svg"
application/console_wrapper_icon=""
application/icon_interpolation=4
application/company_name="UESTC RPG"
application/product_name="电光年华"
application/file_description="电光年华"
application/file_version="0.1.0.0"
application/product_version="0.1.0.0"
application/copyright=""
application/trademarks=""
application/export_angle=0
application/export_d3d12=1
application/d3d12_agility_sdk_multiarch=false
codesign/enable=false
shader_baker/enabled=true
ssh_remote_deploy/enabled=false
dotnet/include_scripts_content=false
dotnet/include_debug_symbols=false
dotnet/embed_build_outputs=false
